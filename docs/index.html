    "body": "<p class=\"panel-body\">Enoch is a rustic countryside province that sprawls across miles of rolling farmland, its fields of plenty forming a patchwork pattern across the landscape. Serving as the primary breadbasket for all of Druskenvald, it produces crops of every variety tended to by hardworking people and sold at vibrant, bustling markets across the domain. Crystal clear rivers weave through the fertile hills, delivering enchanted water to crops that allow them to grow unnaturally large.</p>\n<p class=\"panel-body\">The scarecrow-like <strong class=\"species-link\" onclick=\"openSpeciesPanel('harvestborn')\">harvestborn</strong>, crafted with care by the lord of Enoch, join in celebration with the other folk of the province to show thanks for the bountiful and relatively peaceful life afforded to them.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">The Moonlit Harvest</div>\n<p class=\"panel-body\">Despite having been driven from most of Druskenvald, primeval Green Magic hums throughout Enoch and infuses the soil, water, and air of the province with unbound growth and fertility. The knowledge of how to harness this vital power has been passed from generation to generation through story and song, providing farmers the ability to complete a full agricultural cycle every month. By the end of the month, the Moonlit Harvest is held, and all the folk of the province, young and old, head into the fields and orchards to reap the month's bounty under a brilliant moon before ending the night with a celebratory festival.</p>\n\n<div class=\"panel-subsection-title\">Crop Trotters</div>\n<p class=\"panel-body\">Crop trotters are giant turkeys with substantial speed, strength, and endurance that serve as the primary beasts of burden in Enoch. The province's people have a great respect and appreciation for these birds, which pull wagons, plow fields, serve as mounts, and even guard farms. For many families, they are cherished as precious pets. Each year, a great race across Enoch called the <strong>Turkey Trot</strong> is held, with folk competing to win the title of Top Trotter.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Methuselah, Lord of Enoch</div>\n<p class=\"panel-body\">The oldest living being in Enoch is also its leader, a black-furred cat-man with eyes as gold as the province's grain fields at harvest time. No one knows where Methuselah came from, how old he is, or how he began crafting and giving life to newly rebirthed harvestborn, but all know that if there's something to learn about Enoch, he can teach it. Wise yet sprightly, he works the fields, shares knowledge, tells tall tales, and sings songs of the harvest, it's said the crops sway to his tune.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Pumpkin Hill</div>\n<p class=\"panel-body\">Atop the highest hillock, Pumpkin Hill overlooks miles of patchworked fields. Packed dirt streets wind through homes, gardens, shops, and gathering halls, converging at a lively town square where weekly markets and monthly festivals celebrate the harvest. Corn husking and pumpkin throwing contests are common, and folk dances bring joyful abandon. The <strong>Candlewick Tavern</strong> is famous for its pumpkin ale renowned across Druskenvald.</p>\n\n<div class=\"panel-subsection-title\">Bramblethorn Brothers' Barnstead</div>\n<p class=\"panel-body\">Barnaby, Bertram, and Bartholomew Bramblethorn run the largest and most advanced farm in Enoch. Favoring technology over tradition, they studied in Edwardia, Bubonia, and Astramar, returning with science, engineering, and alchemy to make a \"modern marvel of agriculture.\" Their feats include week-long seed cycles, tireless harvest constructs, and modified crop trotters of great size and ferocity. Extraordinary yields come with constant side effects and mishaps, if unchecked, their Barnstead could overtake the province.</p>"
  },
  "kalero": {
    "eyebrow": "Province of Celebration & Remembrance",
    "title": "Kalero",
    "pronunciation": "kuh-LAIR-oh",
    "species": "Relicborn",
    "quote": "Moments are fleeting, just like life and love. It's the memories that remain at the end of it all… Will you join me for this dance?",
    "quoteAttrib": "Catrina the Sweet",
    "body": "<p class=\"panel-body\">In Kalero, life and death are celebrated with equal exuberance. Deep canyons carved by roaring rivers dominate the land, their walls cut into settlements, roads, and innumerable tombs from which newly rebirthed <strong class=\"species-link\" onclick=\"openSpeciesPanel('relicborn')\">relicborn</strong> emerge. These skeletal folk and others adorn themselves in vibrant colors and marigold garlands as they paint intricate murals honoring those who came before. Markets bustle and remembrance celebrations never cease.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">River of Remembrance</div>\n<p class=\"panel-body\">The River of Remembrance winds through Kalero's deep canyons like a nautical strait, shaping both land and memory. Its waters contain the lingering memories of souls lost to the Shroud. Those who peer into the current see spectral scenes of extinguished lives. The river is also a vital trade route, navigated by ships of all sizes, but plagued by sudden rapids, whirlpools, hungry river beasts, and vicious pirates lurking in hidden coves.</p>\n\n<div class=\"panel-subsection-title\">The Thousand Bones</div>\n<p class=\"panel-body\">Countless towering pillar-like rock formations rise across Kalero. Scaling them is near-impossible, made deadlier by violent gales and colossal vultures nesting on the spires. Yet fortune hunters try, believing golden cities and lost magical technology rest atop the bones. The secret to reaching the top is said to lie in the lost memories of Kalero's first inhabitants, hidden in a remote canyon tomb.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Catrina the Sweet, Lady of Kalero</div>\n<p class=\"panel-body\">A relicborn ruler who rules as she dances, vivacious and full of life that only the dead can truly savor. Her skeletal features are adorned in rainbow patterns, swirling silks, jangling jewelry, and a mane of living curls. Dismissed by rivals at their peril, Catrina pairs gregarious delight with playful cunning and fierce protection of her province's past, present, and future.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Memento</div>\n<p class=\"panel-body\">Built into sheer canyon walls overlooking the River of Remembrance, Memento is a many-tiered city etched with memories and lined with altars. It never sleeps, bands play, dances whirl, shops sell flowers and sweets, and visitors flock to see the <strong>Screaming Skulls</strong>: magical fireworks that screech skyward and burst into brilliant images of the departed.</p>\n\n<div class=\"panel-subsection-title\">Port Melee</div>\n<p class=\"panel-body\">A protected cove houses Kalero's largest port and southern Druskenvald's center of commerce. Markets overflow with goods from every province, and rarities from beyond the Shroud. The <strong>Dorado Auction House</strong> traffics in curiosities on the black market. With riches comes constant conflict with pirates and bandits, but magical cannons that launch Screaming Skulls and a culture of martial prowess hold the line. Home to <strong>The Mastered Hand</strong> school and its elite Wave Dashers.</p>"
  },
  "nerukhet": {
    "eyebrow": "The Gemlit Underground Kingdom",
    "title": "Nerukhet",
    "pronunciation": "NAIR-oo-KET",
    "species": "Silkborn",
    "quote": "When doom came to the First Kingdom, we survived… In the forgotten and abandoned places of the world, we did not find this paradise waiting for us. We built it.",
    "quoteAttrib": "God King Xanatep",
    "body": "<p class=\"panel-body\">Deep beneath desolate southeastern mountains and ruins lies Nerukhet, a grand underground province lit by kaleidoscopic geodes across monumental cities and webbed tunnels from which the spider-like <strong class=\"species-link\" onclick=\"openSpeciesPanel('silkborn')\">silkborn</strong> emerge. Its people strive for greatness and divine favor, yet unrest always churns beneath, and far worse things squirm in the darkest depths.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">Tears of the Gods</div>\n<p class=\"panel-body\">Massive, sparkling gemstones, Tears of the Gods, feature prominently in Nerukhet's history. Legend says the gods wept when the First Kingdom fell, calling survivors below and gifting these gems that hum with divine vitality. They grant long life, a sharp mind, a strong body, and a sturdy constitution. Coveted and collected by the wealthiest houses, they pass down as inheritance, serve as currency, and are worn as status symbols.</p>\n\n<div class=\"panel-subsection-title\">The Bejeweled</div>\n<p class=\"panel-body\">Enormous, divine insects and arachnids with carapaces encrusted with jewels live in harmony with Nerukhet's people. Heralds of the gods, they share psychic bonds with families across generations. Hound-sized spiders spin the silk that clothes the province; huge locusts provide air travel; enormous scarabs build; and the rarest are dragon-sized scorpions used as symbols of divinity by powerful houses.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">God King Xanatep, Lord of Nerukhet</div>\n<p class=\"panel-body\">Said to be the only silkborn to ascend to divinity and immortality, Xanatep rules Nerukhet, pledging only begrudging fealty to Phillip Druskenvald. He commands <strong>Vekloriash the Amethyst Dread</strong>, the largest and deadliest bejeweled scorpion, unique with great dragonfly wings. Through the Tears of the Gods, he sees across Nerukhet; few escape his gaze. His pride is unmatched, and his true aim is the greatness of Nerukhet above all else.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Arakir, the Skittering City</div>\n<p class=\"panel-body\">A many-tiered, glittering capital and wonder of Druskenvald, radiant geodes, temples, tombs, palaces, and beautiful underground gardens. The <strong>Lapis Library</strong> preserves millennia of history and poetry. The infamous <strong>Tunnel of Claws</strong> houses wild, unclaimed bejeweled scorpions for those brave enough to bond with one.</p>\n\n<div class=\"panel-subsection-title\">The Crawling Doom</div>\n<p class=\"panel-body\">In the deepest pit lies a ruined place shrouded in legend and dread. Mighty priests sealed it with intricate spells long ago, and the details of what transpired there are not spoken of freely, even in Nerukhet. It is said that the seal weakens with each passing year, and that whatever waits in the darkness below is growing more patient, not less.</p>"
  },
  "olmarsh": {
    "eyebrow": "Province of the Drowned Shore",
    "title": "Olmarsh",
    "pronunciation": "OAL-marsh",
    "species": "Deepborn",
    "quote": "Hark, Leviathan! Hark, Albatross! … May salt foam and bilgewater forget the name of the Drowned!",
    "quoteAttrib": "Captain Ephraim Wake",
    "body": "<p class=\"panel-body\">Olmarsh stretches along rocky shores and flooded salt marshes and includes numerous coastal islands. A shadow rises from below, gripping its people with fear of the unknown. Fishing sustains life beyond meager land resources, but the black ocean's threats are constant. Even the <strong class=\"species-link\" onclick=\"openSpeciesPanel('deepborn')\">deepborn</strong> fled the depths to live on the surface, and an ever-present sense of being watched weighs from the night sky. The air is cold, viscous, and fish-stinking.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">Light of the Drowned</div>\n<p class=\"panel-body\">Eldritch storms whip up from nowhere, swallowing ships and leaving survivors babbling. The only defense against the cosmic intrusions they bring is a chain of lighthouses shining eerie ghostly light. The cost is dire, the lamps are fueled by souls lost at sea. Lone keepers tend each light, battered by incessant wails. It is an honor and a doom, their minds shatter as they grant safe passage to others.</p>\n\n<div class=\"panel-subsection-title\">The Hungering Ones</div>\n<p class=\"panel-body\">Colossal sea monsters are the greatest threat to Olmarsh: shelled krakens, white megalodons, fiend-whales, titanic crabs. Feared yet worshipped, they are offered food, treasure, and sacrifice in hopes of being spared. Daring crews harvest slain behemoths for <strong>Tide Ash</strong>, a valuable psychedelic found in every beast's heart. A mythical shell is said to exist that, blown like a horn, can bind a Hungering One to the blower's will.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Captain Ephraim Wake, Lord of Olmarsh</div>\n<p class=\"panel-body\">A renowned deepborn sailor and one of the first lighthouse keepers, Wake lasted longer than any before succumbing to the lamp's delusions. He swam to a siren, was devoured by a Hungering One, and returned the next night as a spirit bearing secrets of the deep and sight beyond the stars. Now lord of Olmarsh, he appears as a burly green ghost with a beard of tentacles and seaweed, mostly lucid, sometimes raving truths of superstitions and looming dangers.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Ibbsmouth</div>\n<p class=\"panel-body\">The fog-bound coastal capital and largest port in Druskenvald. Crooked streets, gray buildings, and people who seem somehow \"off.\" Despite the gloom, sailors and traders flock here before pursuing the supernatural bounty offshore. Eldritch relics are traded behind closed doors; chapels to the Hungering Ones are disturbingly busy. The infamous <strong>Seven Sisters</strong> tavern serves seafood stew to raucous clientele.</p>\n\n<div class=\"panel-subsection-title\">Darktide Manor</div>\n<p class=\"panel-body\">On treacherous cliffs at Seabird's Fall stands an impossible mansion, the headquarters of the <strong>Nautilus Order</strong>. Protected by spells, curses, marsh, and gales, it houses a museum of curiosities and a small university of the strange. Initiation requires venturing to a black reef on a night it rises and sacrificing something, or someone, precious.</p>"
  },
  "pholsense": {
    "eyebrow": "Province of the Silver Path",
    "title": "Pholsense",
    "pronunciation": "FOAL-senss",
    "species": "Stoneborn",
    "quote": "The Silver Path of the righteous is beset on all sides by the wickedness of the sinner and the heresy of the witch…",
    "quoteAttrib": "Archbishop Danton Alexandre Renault",
    "body": "<p class=\"panel-body\">In Pholsense, life is measured by adherence to divine law. Quiet towns dot rolling hills, farmland, and woods, yet fear of straying from the Silver Path is constant. In great stone cities, built from the same rock as the gargoyle-like <strong class=\"species-link\" onclick=\"openSpeciesPanel('stoneborn')\">stoneborn</strong>, zealous militants judge and purge the wayward. Magic not of faith is distrusted; the wrong spell at the wrong time leads to a fiery fate.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">The Silver Path</div>\n<p class=\"panel-body\">More than a religion, the Silver Path is the god, an imperceivable divine will upholding five tenets: <strong>piousness, temperance, diligence, unity, and sacrifice</strong>. Zero tolerance for sin or apathy. Bells ring constantly throughout Pholsense, the faithful claim it is the god's voice. Clergy assert only they can truly interpret it, culminating in the supreme authority of the Archbishop.</p>\n\n<div class=\"panel-subsection-title\">The Silver Hammer</div>\n<p class=\"panel-body\">A knightly order of inquisitors and crusaders, the Silver Hammer seeks out evil as defined by the Path. Some chapters protect innocents; others use extreme, cruel methods justified as necessity. Fair trials are rare when suspicion takes root. Arcane and primal magic users are distrusted and sometimes dealt with indiscriminately, those who register and vow to serve good are tolerated or tasked to fight witchcraft with fire.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Archbishop Danton Alexandre Renault, Lord of Pholsense</div>\n<p class=\"panel-body\">Tall, thin, and silver-skinned with angelic eyes, Renault leads the province and church under the same five tenets. He strives for perfection, especially in his craft of carving the stoneborn, and expects it of his flock, offering forgiveness to those who confess and accept harsh penance. He delivers blistering sermons from Cyril's Cathedral of the Silver Rapture with absolute conviction.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Cyril</div>\n<p class=\"panel-body\">A shining silver metropolis, one of Druskenvald's greatest, of polished stone, towering statues, and multi-tiered fountains. The <strong>Cathedral of the Silver Rapture</strong> rings dozens of colossal bells at all hours. Headquarters of the Silver Hammer and its inquisitorium's gaol, where heretics, innocent or not, are imprisoned. The <strong>Cyril Orphanage</strong> houses thousands of children. Famous catacombs sprawl beneath the city; not all visitors return.</p>"
  },
  "picco": {
    "eyebrow": "Province of Endless Play",
    "title": "Picco",
    "pronunciation": "PEE-koh",
    "species": "Threadborn",
    "quote": "Why did Blinski build the happiest place in Druskenvald? … If Blinski can show them wonder, they might believe that change is possible.",
    "quoteAttrib": "Blinski II",
    "body": "<p class=\"panel-body\">In Picco, fun is law. A realm of high energy and constant motion, where real-world play thrives and wild imagination is made manifest by the master toymaker <strong>Blinski II</strong>. From his walking mechanical workshop, he creates new toys, attractions, and the doll-like <strong class=\"species-link\" onclick=\"openSpeciesPanel('threadborn')\">threadborn</strong>, whom he loves most. To a discordant calliope, lives whirl through a fabricated landscape of cloth and props. The thrills are joyous, and often dangerous, sometimes deadly, leaving the uninitiated exhausted or terrified.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">Fun Tickets</div>\n<p class=\"panel-body\">Picco's currency is shiny carnival tickets in vibrant colors that denote different uses, food, rides, balloon travel. They power Funtopia's economy and are acquired by purchase, work, game prizes, or achieving incredible challenges. Rare tickets earned from death-defying feats hold unique magic. Collectors scour the province for them. Rumors speak of exclusive attractions and artifacts that require these rarities to access.</p>\n\n<div class=\"panel-subsection-title\">Jolly Jangles</div>\n<p class=\"panel-body\">Blinski mandated happiness, and created <strong>Jolly Jangles</strong>, an enormous flying cymbal monkey that guards Picco. It senses the province's mood and sniffs out negative emotions. Jolly first tries to cheer; if sadness persists, he abducts the \"downers\" to Blinski's workshop for \"tinkering\" until unbound fun is restored. The precise nature of this tinkering is not discussed in polite company.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Blinski II, Lord of Picco</div>\n<p class=\"panel-body\">A gregarious automaton with booming laughter and infectious cheer, Blinski II created Picco and most of its inhabitants, whom he repairs with deep affection. He travels in his walking workshop, plays with his subjects, and offers free repairs to any who need them. In a realm of night and misery, he believes it his duty to bring joy. His childlike innocence, despite great age, makes him easy to manipulate among nobles, sometimes leading to disastrous deeds done with entirely pure intent.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Funtopia</div>\n<p class=\"panel-body\">The capital, equal parts carnival, amusement park, and city, runs on magical engineering. Mass-transit rides rocket commuters across themed districts:</p>\n<ul class=\"panel-body\">\n  <li><strong>Crazy Clown Hell</strong>, Hot, devilish, and packed with death-defying attractions. HQ of the Honk Legion.</li>\n  <li><strong>Dinoworld</strong>, Mechanical dinosaurs amid jungle facsimiles, with a university that teaches only fun subjects.</li>\n  <li><strong>Strahdanya's Castlemania</strong>, Spooky district for fun-filled frights; the Cravencroft Theater nightly stages <em>Curse of Strahdanya</em>.</li>\n  <li><strong>Friendlyville</strong>, Wholesome fun and cozy cottages, a haven for lost and misfit toys. Mayor is a plump stuffed llama named Cream Cheese.</li>\n  <li><strong>Captain Bone's Lagoon</strong>, Province-sized water park; wave pools, lazy rivers, the never-ending Captain Bone's Wild Slide.</li>\n  <li><strong>Neonopolis</strong>, Music district of bright lights and cosmic paint. Much is under construction, signs promise the greatest attraction is yet to come.</li>\n</ul>"
  },
  "syndramas": {
    "eyebrow": "Province of the Frozen War",
    "title": "Syndramas",
    "pronunciation": "sin-DRAH-mus",
    "species": "Graveborn",
    "quote": "The other provinces recoil when they gaze upon the warriors of Syndramas… War makes monsters of us all.",
    "quoteAttrib": "Wyrm Queen Sapphira",
    "body": "<p class=\"panel-body\">Far to the frozen north, Syndramas is a province of perpetual battle, where the dead fight, die, and rise again to continue a war so old none recall its spark. Three warring legions scoff at peace; conflict rages across snow-bound wastes where dragon bones rest and the undead <strong class=\"species-link\" onclick=\"openSpeciesPanel('graveborn')\">graveborn</strong> rise. Necrotic power saturates the land, anything that dies here rises as Undead to swell the legions.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">The Sepulchral Legions</div>\n<p class=\"panel-body\">Three militant legions vie eternally, each with distinct culture, tactics, and occult arts. All pledge to Wyrm Queen Sapphira, who encourages conflict within borders, total annihilation of rivals is the victory condition, and prelude to conquering Druskenvald:</p>\n<ul class=\"panel-body\">\n  <li><strong>The Rimeshade Legion</strong>, Heavily plated in drakkonite with icy, runic blades; unmatched armory, immense war machines, and floating fortresses of ancient magic.</li>\n  <li><strong>The Bloodboil Legion</strong>, Total devotion and perfect synchronicity; mastery of combat through blood magic rituals granting supernatural strength and instinct.</li>\n  <li><strong>The Marrowfeast Legion</strong>, Sheer numbers and viciousness; hives of dragon bone; relentless waves and vile necrotic magic that withers enemies.</li>\n</ul>\n\n<div class=\"panel-subsection-title\">Drakkonite</div>\n<p class=\"panel-body\">From the civil war that slew countless dragons, their essence leeched into the land, creating drakkonite, a dark, unnaturally cold metal. Incredibly sharp, strong, and light, it is used for weapons, armor, and structures. Drakkonite mines are hotly contested even by outsiders who risk the frozen wastes to claim it.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Wyrm Queen Sapphira, Lady of Syndramas</div>\n<p class=\"panel-body\">The last to die in the kingdom's brutal civil war, Sapphira's final rage sparked a necrotic chain reaction turning the province to undeath and raising her as an immense necromancer, now a skeletal dragon with desiccated gray flesh and patches of blue-white scales. She spared dragonkind from such existence; instead she raised the former humans as graveborn and rules them with pride and ruthlessness. The province's necrotic hunger has grown beyond even her control; peace is now impossible.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Sepultura</div>\n<p class=\"panel-body\">An enormous fortified necropolis in the center of Syndramas, neutral ground where all legions maintain a truce within the walls and ten miles beyond. Violations are unthinkable; any who dare face Sapphira in her drakkonite citadel. Quarters are divided between the three legions and the neutral Wyrm Quarter for business with the Queensguard. Visitors are rare, but coin flows for comforts soldiers seldom otherwise know.</p>\n\n<div class=\"panel-subsection-title\">Dragons' End</div>\n<p class=\"panel-body\">A sacred valley graveyard of countless dragon skeletons, the site of the war's bloodiest battle. Sapphira sometimes pilgrimages here to grieve. Powerful artifacts lie scattered among the bones; would-be robbers face deadly elements, scavenging beasts, and lingering curses that have claimed many fortune hunters.</p>"
  },
  "zulrogg": {
    "eyebrow": "Province of the Living Swamp",
    "title": "Zulrogg",
    "pronunciation": "ZULL-rawg",
    "species": "Bogborn",
    "quote": "Wait. Do you hear that? It is the singing frog. It is your grandfather. It is the rain. It is the old mangrove tree. It is your mother. It is me. It is you. Look upon your reflection and listen. Will you answer?",
    "quoteAttrib": "Tazri Swampcaller",
    "body": "<p class=\"panel-body\">Despite existing in an otherworldly domain of death, the vast, tropical swamps of Zulrogg teem with life. Underneath a dense canopy of twisting, vine-choked trees, each stage of the cycle of life, death, and rebirth thrives in harmony with the others. Primal and ancestral spirits drift back and forth through the veil, offering their wisdom and guidance to those who seek it. The amphibious <strong class=\"species-link\" onclick=\"openSpeciesPanel('bogborn')\">bogborn</strong> emerge from the mire after rebirth, forming unbreakable bonds with the bog's beasts, both natural and supernatural.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">Spirit Beasts</div>\n<p class=\"panel-body\">The province is watched over by great wild spirits that are worshipped by the people of Zulrogg. Each one takes the form of a different creature of the swamps, jungles, and shorelines and is said to possess the wisdom of all the ancestors who favored that particular spirit. Zulrogg's society is based upon the reverence of and communion with these Spirit Beasts, and making regular offerings to different spirits for different things is a fact of daily life.</p>\n<p class=\"panel-body\">This deep connection to mortals makes the spirits vulnerable, malevolent ritualists seek to capture them and siphon their essence for their own ends.</p>\n\n<div class=\"panel-subsection-title\">Everblooms</div>\n<p class=\"panel-body\">Countless useful flora fill Zulrogg, fueling rites, rituals, and medicine. The rarest are <strong>Everblooms</strong>, delicate flowers of pink, purple, orange, and gold, radiant with primal rebirth. They appear only in remote places at specific times and require a Spirit Beast's guidance to find. Carefully harvested petals enable master spirit priests to work miracles of healing, raise the dead, and grant immortal youth, given only to those proven worthy in the eyes of the spirits.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Tazri Swampcaller, Lady of Zulrogg</div>\n<p class=\"panel-body\">A bogborn spirit priest and Crescent Court member who eschews politics, Tazri leads by example and spiritual guidance. Chosen by the Hydra Spirit as its speaker, she bears many heads' worth of wisdom and is considered among the most insightful beings in all of Druskenvald. Centuries old, she extends her life with Everblooms until she finds a worthy successor. Her age seems to flicker. Eccentric and obsessed with collecting, she believes the swamp gives everything with purpose.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Gurash'Atal</div>\n<p class=\"panel-body\">The largest of the stilted cities, built atop water and through trees, its wooden streets and structures connected by elaborate walkways and rope bridges. Long-necked reptilian swamp beasts ferry travelers; saber-toothed felines serve as climber-mounts. Shrines to Spirit Beasts grant blessings throughout the city. The <strong>Swampstalker Lodge</strong> displays legendary hunting trophies and teaches tracking and trapping.</p>\n\n<div class=\"panel-subsection-title\">Sunken Temple of Rakan'Zahl</div>\n<p class=\"panel-body\">An ancient stone temple sank beneath the swamp long ago, its dry chambers somehow intact. Those who find the hidden entrance discover ritual rooms and grottos overgrown by the bog. A cult now practices malign rites here, seeking to elevate their patron to godhood using the temple's secrets, through methods that threaten every soul in the province.</p>"
  }
};
