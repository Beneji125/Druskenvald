  "wm_crimson": {
    "default": "<p class=\"panel-body\">High in the Howlers, overlooking both the Silverbell River and the trembling town of Dawn's Gate below, stands the Crimson Monastery, stone walls, a great bell tower, and a cathedral lit always by candlelight and something else that isn't quite candlelight. Its abbot preaches purity and salvation to a flock that adores him without reservation, and to hear his sermons, the monastery is the last honest sanctuary left in a wicked hollow.</p>\n<p class=\"panel-body\">Those who decline the invitation to convert rarely get a second one. Riders and bat hounds come down from the mountainside in the dead of night, dragging the unconverted back up to the monastery's gates, and what happens behind those gates is a mystery to everyone except the people it's happened to, and they don't get the chance to talk about it afterward. The monastery calls its goddess the Crimson Rose. No one in Dawn's Gate has ever been permitted to actually see her.</p>",
    "byGroup": {
      "1": "[[The Crimson Monastery]]<p class=\"panel-subheader\">Night of Flames</p>\n<p class=\"panel-body\">You arrived at the foot of the monastery, its red stained-glass windows seeming to watch you approach. The guards welcomed you inside without hesitation, after all, it was the Night of Flames. You could hear the chanting before you ever reached the courtyard: \"Glory to the Crimson Rose, blood from the thorn, beauty from the petal!\" A pyre stood at the center, ringed with unbelievers waiting their turn. One by one they repented and joined the Crimson Rose, all but one. Gareth, the very man <strong class=\"npc-link\" onclick=\"openNpcPanel('weston')\">Weston</strong> had sent you to find.</p>\n<p class=\"panel-body\">Korrin tried to talk him down, but panic and the strangeness of a voice speaking inside his own head weren't helping matters, though that same voice also told him of Melina, and that it was she who wanted Gareth to come home. <strong class=\"npc-link\" onclick=\"openNpcPanel('olaf')\">Friar Olaf</strong> was already moving to light the pyre when Megumin stepped in, offering to try where Korrin hadn't succeeded. First, though, she had to win over the Crimson Abbot himself, and luck was on her side there, he'd taken a particular interest in her and let her proceed. With charm and unshakable logic, she talked Gareth into repenting and joining the Crimson Rose, if only to save his own skin. No one burned on the pyre that Night of Flames. Many new believers joined the Crimson Rose instead, or so the monastery was meant to think.</p>\n<p class=\"panel-subheader\">Behind the Walls</p>\n<p class=\"panel-body\">The next night was for scouting and mapping the monastery itself. Imposing as it looked from outside, it was surprisingly calm within, the halls usually silent save for the whispers of believers passing through. Some of them wore unusual features, pale skin, vacant stares, pointed ears, the occasional flash of fangs. These were what the monastery called the Bloodless, its most devoted, though notably not Friar Olaf, <strong class=\"npc-link\" onclick=\"openNpcPanel('jaeger')\">Houndmaster Jaeger</strong>, or <strong class=\"npc-link\" onclick=\"openNpcPanel('cromwell')\">Inquisitor Cromwell</strong>.</p>\n<p class=\"panel-body\">You made a friend as well. <strong class=\"npc-link\" onclick=\"openNpcPanel('andreas')\">Andreas Maler</strong>, son of <strong class=\"npc-link\" onclick=\"openNpcPanel('august')\">August Maler</strong>, saw in you a chance to change this place for the better, though he wasn't sure at first, one misstep could easily cost him his life. He took the risk anyway and shared what he'd managed to find. Inquisitor Cromwell grew suspicious too, and paid Andreas a visit of her own not long after. Quick thinking and quicker hiding kept you out of sight and off her radar.</p>\n<p class=\"panel-subheader\">The Dead Larder</p>\n<p class=\"panel-body\">In the Dead Larder you found believers of the Crimson Rose chained and near death from cold and exhaustion, punished for following Olaf into the sanctum and seeing something there that could not have belonged to any true goddess.</p>\n<p class=\"panel-subheader\">Cromwell's Trophies</p>\n<p class=\"panel-body\">Getting into Inquisitor Cromwell's room proved simple enough. What waited inside was not: a wall of hunting trophies and weapons, a slave catcher's rig among the worst of it, and a collection of jewelry that made for a fine addition to the haul.</p>\n<p class=\"panel-subheader\">The Belfry</p>\n<p class=\"panel-body\">The Crimson Abbot himself invited you to speak with him in the belfry, a conversation that circled purpose, loyalty, power, and what role you might play in the Crimson Rose's future. But he sensed something in you as well, anger, duplicity, lies he couldn't quite name, though he could clearly feel them all the same.</p>\n<p class=\"panel-subheader\">Into the Sanctum</p>\n<p class=\"panel-body\">There was no more time to wait, not if the people in the larder were to be saved. In Olaf's own chambers you found the steps needed to reach the sanctum of the Crimson Rose, and with that, you went down into the bowels of the beast.</p>[[SCENE_Chapter14_Viraxys]]\n<p class=\"panel-subheader\">The Abbot Falls</p>\n<p class=\"panel-body\">Only the five of you were left standing in the blood-stained cathedral by the end. The Crimson Abbot, <strong class=\"npc-link\" onclick=\"openNpcPanel('renathyr')\">Marius Renathyr</strong>, vanished in sulfur and flame, his sword left standing in the altar, and with him, the power of the Crimson Rose, of Viraxys, gone from the monastery, hopefully for good.</p>\n<p class=\"panel-body\">Olaf was the first to come asking what had happened, and you brought him in quickly and laid out the plan. He agreed without much convincing, willing to do anything to save his own skin and keep his hold on power.</p>\n<p class=\"panel-subheader\">A Fragile Peace</p>\n<p class=\"panel-body\">Whether it would have worked is hard to say. Men like Olaf are difficult to predict, and fear of a show of power can just as easily be swallowed by greed. The same held true for Inquisitor Cromwell. She would never have beaten Olaf outright in a war between the faithful, but if someone were to inform her, catch Olaf isolated, and lend her the hounds to do it, the balance of power would tip fast. Holding the monastery in that moment was already a losing effort, the townsfolk armed and restless, the faithful who remained disoriented and unsure what had even happened. None of that mattered to Cromwell. She would find whoever killed Renathyr, and she would see them burn.</p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_dawns_gate": {
    "default": "<p class=\"panel-body\">Dawn's Gate sits where the moors give way to the foothills of the Howlers, a hunting and mining town that has survived on the mountain's resources for generations. It should, by rights, be one of the more peaceful corners of the hollow, it is instead one of the most frightened, living every night in the shadow of the monastery that looms directly above it.</p>[[SCENE_Chapter14_Environment]]\n<p class=\"panel-body\">The riders come without warning, baying hounds and torchlight cutting down the mountainside toward whoever the monastery has decided needs saving from themselves. Families keep their doors barred and their opinions about the Crimson Faith carefully unspoken, because in Dawn's Gate, the difference between a devout neighbor and an informant is impossible to know until it's already cost you someone.</p>",
    "byGroup": {
      "1": "<p class=\"panel-subheader\">A Familiar Face</p>\n<p class=\"panel-body\">You arrived that morning to a commotion in the town square. Someone was addressing a crowd, though you only caught the tail end of it before the speaker leapt down and was already halfway out of town. The figure looked like Sylas, or near enough to pass for him. Megumin stopped him, trying to understand who or what he is, he spared a few words for Megumin, but as if finishing a monologue and leaving the stage, he quickly snuck past Megumin. She tried to stop him using a spell, but sadly it backfired, with the spell giving him the cover to slip out of your reach.</p>\n<p class=\"panel-subheader\">The Briar Public House</p>\n<p class=\"panel-body\">Your path led you to the Briar Public House, where Sylas was busy making, or perhaps leveraging, a friendship with <strong class=\"npc-link\" onclick=\"openNpcPanel('kristoff')\">Kristoff Gruber</strong>, one that paid Kristoff handsomely for his trouble. Whether that investment ever pays off in kind remains to be seen.</p>\n<p class=\"panel-body\">Tharn met <strong class=\"npc-link\" onclick=\"openNpcPanel('tabitha')\">Tabitha Druckeryn</strong> at the bar, a seamstress who wanted more out of life than the town seemed willing to give her. She'd hoped for at least a proper goodbye before you moved on, and didn't get one. Perhaps their paths will cross again before this is all over.</p>\n<p class=\"panel-body\">Korrin and Webrin found their own connection that night, to the same man, though for very different reasons. <strong class=\"npc-link\" onclick=\"openNpcPanel('august')\">August Maler</strong>, illuminator and father of <strong class=\"npc-link\" onclick=\"openNpcPanel('andreas')\">Andreas Maler</strong>, drew Korrin in for his skill and knowledge, the kind of mind worth learning from. Webrin saw something else entirely in him. Whether her webbed heart beat any faster holding his hand is hers to say, but two widowers finding each other in a town like Dawn's Gate is the kind of thread that has a way of pulling tighter over time.</p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_webwoods": {
    "default": "<p class=\"panel-body\">The Webwoods hold up to their name well enough on their own. Silk drapes over branch and bramble the moment the road bends south of it, and the farther you veer from the path, the thicker it grows, strand over strand, until it's less a forest and more a single vast, patient structure that happens to have trees growing through it. Every step further in comes with the sense of something testing the ground first.</p>\n<p class=\"panel-body\">Spiders here run larger than they have any right to, and there are more of them the deeper you go. Some travelers who've made it out swear the trees themselves shift position after dark, roots pulling free and settling somewhere new by morning, though no one's ever caught one moving, only ever the difference between where a tree stood at dusk and where it stands at dawn.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_maidenmist": {
    "default": "<p class=\"panel-body\">South of the village, the hills roll on for miles into fog and headstones, Maidenmist Cemetery, final resting place for every soul the hollow has ever lost, for longer than anyone can account for. It has always been there, as far as anyone knows; no records mark its founding, and the wrought iron fence that rings it is said, by the people who live closest to it, to creep a little further outward every single night.</p>[[SCENE_Chapter19_Maidenmist_Cemetery]]\n<p class=\"panel-body\">There is truth under that superstition. The cemetery sits atop a tear in the Shroud itself, a wound that lets the valley's dead rest properly on one side and lets something considerably less peaceful claw at the seam from the other. A lone gravedigger has kept that seam closed for longer than any single soul should have to carry a burden like that, alone, in the fog, with the gate creeping a little closer to the village with every night that he manages to hold the line.</p>[[Maidenmist Cemetery]]",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_silverbell": {
    "default": "<p class=\"panel-body\">Every road in Wickermoor Hollow eventually touches the Silverbell, the river that threads the whole valley together, rising somewhere out past the Drowned Crossroads, curling past the village that grew up along its banks specifically because of it, and finally emptying its whole silvered length into the wide grey reach of Moonsong Lake.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_ghostlight_express": {
    "default": "<p class=\"panel-body\">The Ghostlight Express is no ordinary train. It carries the newly dead through the Shroud toward Druskenvald, offering the departed one final journey before whatever waits for them on the other side, and on the rarest occasions, it grants passage to the living too. It manifests wherever it's needed, always at the dead of the night, most often near graveyards or standing stones, and once boarded, there's no getting off until it reaches wherever it's decided you need to go.</p>[[SCENE_Chapter25_Epilogue]]",
    "byGroup": {
      "1": "[[The Ghostlight Express]]<p class=\"panel-subheader\">All Aboard</p>\n<p class=\"panel-body\"><em>A train stop in the middle of nowhere. A puppet, a tree, a bird, and a devil, all drawn to it. Little did they know a spider would join them in time as well.</em></p>\n<p class=\"panel-body\">Fog surrounded you, thick enough that only a single fiddle managed to cut through it. Then came a train whistle, and a ghostly blue light, and the train itself, stopping right in front of you. A <strong class=\"npc-link\" onclick=\"openNpcPanel('vagrant')\">frogman</strong> stepped down from it and asked for your tickets. For two of you, this was the first time your eyes had ever opened in this world. For the other two, it was every bit as strange as it was for you. You boarded anyway. The train had to stay on schedule, and as long as you held a ticket, you were always welcome aboard the Ghostlight Express.</p>\n<p class=\"panel-subheader\">The Trainhopper</p>\n<p class=\"panel-body\">Inside, you were ambushed by a <strong class=\"npc-link\" onclick=\"openNpcPanel('trainhopper')\">trainhopper</strong>, one that shattered a window and let the wailing Shroud pour in, twisting one of the ghostly passengers into something monstrous. You prevailed, though it's hard to say what might have become of your own souls if you hadn't.</p>\n<p class=\"panel-subheader\">Unfinished Business</p>\n<p class=\"panel-body\">The frogman asked for your help after that, calming the other spirits aboard, souls too tangled in unfinished business to move on. Along the way, Megumin crossed paths with a gramophone playing a song like nothing you'd heard before, and you found a pair of curious string marionettes tucked away in the cars. One by one, you helped them all: <strong class=\"npc-link\" onclick=\"openNpcPanel('daydreamer')\">the Daydreamer</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('sweetheart')\">the Sweetheart</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('mariner')\">the Mariner</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('harlequin')\">the Harlequin</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('jailbird')\">the Jailbird</strong>, and <strong class=\"npc-link\" onclick=\"openNpcPanel('songstress')\">the Songstress</strong>, each of them finally free to move on because of you.</p>\n<p class=\"panel-subheader\">Lord and Lady Druskenvald</p>\n<p class=\"panel-body\">The ghosts weren't the only passengers aboard. Lord and Lady Druskenvald were traveling the train as well, cheerful company by any measure, especially <strong class=\"npc-link\" onclick=\"openNpcPanel('adela')\">Adela</strong>, who offered to read your fortunes. Whether you put any stock in divination is another matter entirely.</p>\n<p class=\"panel-subheader\">Derailed</p>\n<p class=\"panel-body\">Belief in fortune-telling or not, something far more powerful than fate had decided to derail the train, throwing you out into a forest watched over by the Crooked Moon. You remember the rest from there. The Ghostlight Express woke to a corrupted life of its own and tried to feed your souls into its boiler, but the train was defeated in the end, its corruption cleansed. You four, along with <strong class=\"npc-link\" onclick=\"openNpcPanel('phillip')\">Phillip</strong> and Adela, were left stranded in the middle of nowhere, with nothing but the frogman's promise that he'd return once the train was fixed.</p>",
      "2": "<p class=\"panel-subheader\">A Little Respite</p>\n<p class=\"panel-body\">Whether the Ghostlight Express was a savior or something else entirely is hard to say, but after everything in Kalero, you were glad for the chance to breathe. It all still felt like a haze, but you'd done good there, whatever it cost you. You even managed to close your eyes for a while in the sleeping wagon, though the dreams that found you there weren't restful for everyone, closer to nightmares for some. You knew of this train. You never imagined you'd actually ride it.</p>\n<p class=\"panel-subheader\">The Trainhopper</p>\n<p class=\"panel-body\">When you moved into the next wagon, ghostly figures were the only passengers aboard. One caught your eye immediately, different from the rest, his neck crooked as if broken, his hue a sickly dark green, antlers rising from his skull. The moment you approached, he sprang up and shattered the window, letting the wailing Shroud pour in and twisting several of the ghostly passengers into something monstrous. You prevailed, though it's hard to say what might have become of your own souls if you hadn't.</p>\n<p class=\"panel-subheader\">Unfinished Business</p>\n<p class=\"panel-body\">The <strong class=\"npc-link\" onclick=\"openNpcPanel('vagrant')\">frogman</strong> asked for your help after that, calming the other spirits aboard, souls too tangled in unfinished business to move on. One by one, you helped them all: <strong class=\"npc-link\" onclick=\"openNpcPanel('daydreamer')\">the Daydreamer</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('sweetheart')\">the Sweetheart</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('mariner')\">the Mariner</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('harlequin')\">the Harlequin</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('jailbird')\">the Jailbird</strong>, and <strong class=\"npc-link\" onclick=\"openNpcPanel('songstress')\">the Songstress</strong>, each of them finally free to move on because of you.</p>\n<p class=\"panel-subheader\">Lord and Lady Druskenvald</p>\n<p class=\"panel-body\">The ghosts weren't the only passengers aboard. Lord and Lady Druskenvald were traveling the train as well, cheerful company by any measure, especially <strong class=\"npc-link\" onclick=\"openNpcPanel('adela')\">Adela</strong>, who offered to read your fortunes. Whether you put any stock in divination is another matter entirely.</p>\n<p class=\"panel-subheader\">Derailed</p>\n<p class=\"panel-body\">Belief in fortune-telling or not, something far more powerful than fate had decided to derail the train, throwing you out into a forest watched over by the Crooked Moon. You remember the rest from there. The Ghostlight Express woke to a corrupted life of its own and tried to feed your souls into its boiler, but the train was defeated in the end, its corruption cleansed. You four, along with <strong class=\"npc-link\" onclick=\"openNpcPanel('phillip')\">Phillip</strong> and Adela, were left stranded in the middle of nowhere, with nothing but the frogman's promise that he'd return once the train was fixed.</p>",
      "3": "<p class=\"panel-subheader\">All Aboard</p>\n<p class=\"panel-body\">A crossroads, standing stones, and fog, a place of power if there ever was one. All of you were drawn to it, and one by one, you arrived. Distrust and wariness passed between you, warranted enough, strangers with no reason yet to trust one another, no answer for who the others were or why they'd been called here too. The fog around you thickened with every passing minute, until only a single fiddle managed to cut through it. Then came a train whistle, and a ghostly blue light, and the train itself, stopping right in front of you. A <strong class=\"npc-link\" onclick=\"openNpcPanel('vagrant')\">frogman</strong> stepped down and asked for your tickets. Unusual as it was, even by the standards of some of you, you had tickets in hand, and understood, somehow, that this was exactly why you'd been drawn here. You boarded. The train had to stay on schedule, and as long as you held a ticket, you were always welcome aboard the Ghostlight Express.</p>\n<p class=\"panel-subheader\">The Trainhopper</p>\n<p class=\"panel-body\">In the passenger wagon, ghostly figures were the only ones aboard. One caught your eye immediately, different from the rest, his neck crooked as if broken, his hue a sickly dark green, antlers rising from his skull. The moment you approached, he sprang up and shattered the window, letting the wailing Shroud pour in and twisting several of the ghostly passengers into something monstrous. You prevailed, though it's hard to say what might have become of your own souls if you hadn't.</p>\n<p class=\"panel-subheader\">Unfinished Business</p>\n<p class=\"panel-body\">The frogman asked for your help after that, calming the other spirits aboard, souls too tangled in unfinished business to move on. Thanks to you, <strong class=\"npc-link\" onclick=\"openNpcPanel('daydreamer')\">the Daydreamer</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('mariner')\">the Mariner</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('harlequin')\">the Harlequin</strong>, <strong class=\"npc-link\" onclick=\"openNpcPanel('jailbird')\">the Jailbird</strong>, and <strong class=\"npc-link\" onclick=\"openNpcPanel('songstress')\">the Songstress</strong> all found their way free. <strong class=\"npc-link\" onclick=\"openNpcPanel('sweetheart')\">The Sweetheart</strong> was not so fortunate. Whatever waited for her on the other side, she will never reach it now.</p>\n<p class=\"panel-subheader\">Lord and Lady Druskenvald</p>\n<p class=\"panel-body\">The ghosts weren't the only passengers aboard. Lord and Lady Druskenvald were traveling the train as well, cheerful company by any measure, especially <strong class=\"npc-link\" onclick=\"openNpcPanel('adela')\">Adela</strong>, who offered to read your fortunes. Whether you put any stock in divination is another matter entirely.</p>\n<p class=\"panel-subheader\">Derailed</p>\n<p class=\"panel-body\">Belief in fortune-telling or not, something far more powerful than fate had decided to derail the train, throwing you out into a forest watched over by the Crooked Moon. You remember the rest from there. The Ghostlight Express woke to a corrupted life of its own and tried to feed your souls into its boiler, but the train was defeated in the end, its corruption cleansed. You four, along with <strong class=\"npc-link\" onclick=\"openNpcPanel('phillip')\">Phillip</strong> and Adela, were left stranded in the middle of nowhere, with nothing but the frogman's promise that he'd return once the train was fixed.</p>"
    }
  }
};

const SPECIES = {
  "gnarlborn": {
    "name": "Gnarlborn",
    "pronunciation": "NAR-ull-born",
    "province": "ardengloom",
    "image": "species/SPECIES_Gnarlborn.png",
    "body": "<p class=\"panel-body\">Gnarlborn are a tree-like species native to Ardengloom, usually sprouting up from the soil of the twisted, dark forest. Their home is forever haunted by the souls of long-dead Fey, which inhabit the enormous, face-bearing trees known as Elderwoods. These folk commune with these beings to receive primordial wisdom.</p><p class=\"panel-body\">Resembling gnarled trees with glowing faces hollowed into the bark, their individual patterns of branches, moss, and lichen can result in a wide diversity of appearances. Most gnarlborn live for over 500 years, but those with the strongest connection to the Elderwoods have been said to live to be thousands of years old.</p>"
  },
  "azureborn": {
    "name": "Azureborn",
    "pronunciation": "A-zher-born",
    "province": "astramar",
    "image": "species/SPECIES_Azureborn.png",
    "body": "<p class=\"panel-body\">Azureborn are a harpy-like species native to Astramar, often materializing from the bright blue night sky filled with twinkling stars and winds of arcane power. Bearing a connection to the aither that courses through the air and land of the province, they are an inherently prescient folk that can divine the future by looking to the cosmos. They have built a society of magical wonder through grand vision, endless curiosity, and dedication to study.</p><p class=\"panel-body\">Sprouting feathers across their entire body and wings attached to each of their arms, this diverse folk can resemble all manner of avian creatures, from raptors with earthy tones to tropical birds of vibrant and colorful plumage. They typically live 100 years, although many of the wisest among them have lived up to 400.</p>"
  },
  "plagueborn": {
    "name": "Plagueborn",
    "pronunciation": "",
    "province": "bubonia",
    "image": "species/SPECIES_Plagueborn.png",
    "body": "<p class=\"panel-body\">Plagueborn are a rat-like species native to Bubonia, typically coalescing in the pestilent haze that hangs over the province. They are deeply connected to the virulent and deadly plague that afflicts and shapes their society, which persists through cunning, ruthlessness, and the sheer will to live. They are the most adaptable species of Druskenvald, quickly discovering the means to survive even the harshest environments.</p><p class=\"panel-body\">Appearing as large plague rats with humanoid physiology, their short fur ranges from grays and browns to various shades of green. They bear jagged teeth and claws that all carry a strain of plague to which they are immune but can prove deadly to others. Their nimble tails can vary greatly in length and thickness, often reflecting their family, clan, or guild. Plagueborn usually live no longer than 100 years.</p>"
  },
  "ashborn": {
    "name": "Ashborn",
    "pronunciation": "",
    "province": "chernabos",
    "image": "species/SPECIES_Ashborn.png",
    "body": "<p class=\"panel-body\">Ashborn are an imp-like species native to Chernabos, typically coalescing from the sulfuric ash of the province's hellfire and brimstone volcanoes. Infused with the fiendish power of the Hells, this folk has managed to survive and even prosper in the barrens and badlands of the province through guile, boldness, and industriousness. Said to be favored by fortune itself, ashborn count on luck to twist the balance in the most dire of situations.</p><p class=\"panel-body\">Their short stature ranges from slight to stout, but this makes them no less dangerous, for each ashborn has a venomous tail resembling a scorpion's, always ready to strike. They sport horns and skin tones in varying shades of red and gray that reflect their devilish origin, and they typically live 100 years.</p>"
  },
  "curseborn": {
    "name": "Curseborn",
    "pronunciation": "",
    "province": "edwardia",
    "image": "species/SPECIES_Curseborn.png",
    "body": "<p class=\"panel-body\">Curseborn are a werewolf-like species native to Edwardia, often emerging from the dense, cursed fog that rolls across the province. Sharing a strong connection to a malediction called the Grey, which demands balance at the threat of certain doom, they have managed to build a civilization of advancement and progress, countered by rampant strife, pollution, and hunger.</p><p class=\"panel-body\">Covered head to toe with thick fur and bearing sharp teeth and claws, this lupine species evokes the hallmarks and appearance of wolves but with clearly humanoid physiology. If not brought to an early grave by the Grey, they typically live for up to 100 years, although technological advancement has led to certain individuals approaching 200 years old.</p>"
  },
  "harvestborn": {
    "name": "Harvestborn",
    "pronunciation": "",
    "province": "enoch",
    "image": "species/SPECIES_Harvestborn.png",
    "body": "<p class=\"panel-body\">Harvestborn are a scarecrow-like species native to Enoch, most often crafted with great care by Methuselah, the lord of the province. Infused with the vital, green magic that surges through the immensely fertile land, they have a strong connection to the cycle of both the harvest and life, death, and rebirth. They feed much of Druskenvald with the crops they grow in a relatively peaceful society that puts a focus on community, family, and fellowship.</p><p class=\"panel-body\">As a constructed species resembling any manner of scarecrow, their bodies are comprised of a mixture of wood, metal, straw, and other implements. Their glowing-eyed heads might be made from a burlap sack or a crop such as a pumpkin or turnip. Staying true to the cycle, they generally live 100 years before accepting the next step of death and becoming reborn once more.</p>"
  },
  "relicborn": {
    "name": "Relicborn",
    "pronunciation": "",
    "province": "kalero",
    "image": "species/SPECIES_Relicborn.png",
    "body": "<p class=\"panel-body\">Relicborn are a skeleton-like species native to Kalero, generally emerging from the numerous tombs and crypts that line the canyon walls of the province. They thrive in a culture of celebration and remembrance, which infuses the very essence of every member of the species. Dancing between the energy of a vivacious party and the serenity of peaceful reflection, this folk holds a deep appreciation for both the living and the dead.</p><p class=\"panel-body\">They appear as skeletons decorated with a wide array of vibrant colors, patterns, and styles, and their bones are encased in a translucent, glowing substance that provides them with a similar mass and shape to other humanoid species, allowing them to comfortably wear clothing and armor. Some relicborn can even grow hair from their skulls, which is often shaped into bombastic styles. Relicborn typically live for 250 years before losing their form and collapsing into a pile of bones.</p>"
  },
  "silkborn": {
    "name": "Silkborn",
    "pronunciation": "",
    "province": "nerukhet",
    "image": "species/SPECIES_Silkborn.png",
    "body": "<p class=\"panel-body\">Silkborn are a spider-like species native to Nerukhet, typically emerging from silken cocoons amidst thick webbing that fills miles of tunnels throughout the subterranean province. They have a deep kinship and connection with the bejeweled arachnids and insects that have assisted them in building the grandest civilization in Druskenvald. This folk also channels the great gems that fill the caverns of the province with light and power, bringing them ever closer to the gods that spared their kind from an ancient calamity.</p><p class=\"panel-body\">While this species has humanoid proportions, they have arachnid features — hardened carapace skin, numerous eyes, segmented limbs that grow from their backs, and mandibles that sprout from their mouths. They generally live for 250 years, but those at the higher echelons of their civilizations have been known to live nearly 800 years.</p>"
  },
  "deepborn": {
    "name": "Deepborn",
    "pronunciation": "",
    "province": "olmarsh",
    "image": "species/SPECIES_Deepborn.png",
    "body": "<p class=\"panel-body\">Deepborn are a fish-like species native to Olmarsh, typically rising up from the abyssal depths of the province's black sea — home to terrors beyond imagining known as the Hungry Ones. Immersed in a near-constant eldritch presence that emerges from the deep and descends from beyond the stars, these folk manage their state of paranoia by embracing and harnessing the uncanny and cosmic.</p><p class=\"panel-body\">While they are primarily piscine in their anatomy, they can possess features found in a wide variety of sea creatures, including cephalopods and crustaceans. They typically live for around 150 years, but certain members of occult orders have been known to live for 600 years.</p>"
  },
  "stoneborn": {
    "name": "Stoneborn",
    "pronunciation": "",
    "province": "pholsense",
    "image": "species/SPECIES_Stoneborn.png",
    "body": "<p class=\"panel-body\">Stoneborn are a gargoyle-like species native to Pholsense, usually meticulously carved by the lord of the province, Archbishop Danton Alexandre Renault. Blessed by the divine power known as the Silver Path, these people can call upon the godliness that suffuses their construction. In a domain of darkness, they have looked to the light of their god to build a civilization that attempts to uphold what is good and lawful at all costs.</p><p class=\"panel-body\">Their stony skin matches the same hue and pattern as the stone they were carved from. While all of their kind have broad wings that carry their dense, heavy bodies, their biology can evoke a wide variety of creatures — including bats, fiends, dragons, birds, angels, dogs, and lizards — often combining features into a chimeric blend. They usually live for 300 years before crumbling into rubble.</p>"
  },
  "threadborn": {
    "name": "Threadborn",
    "pronunciation": "",
    "province": "picco",
    "image": "species/SPECIES_Threadborn.png",
    "body": "<p class=\"panel-body\">Threadborn are a doll-like species native to Picco, most often built with love by Blinski II, the master toymaker and lord of the province. In a land that is mostly fabricated and constructed to maximize the fun of all who live there, the essence of joy, thrill, and friendship are woven into a threadborn's very nature. They cherish the bonds made between loved ones and always maintain a childlike wonder and whimsy, no matter one's age.</p><p class=\"panel-body\">As living dolls, these folk are constructed with a variety of materials, including cloth, wood, metal, porcelain, stuffing, yarn, and anything else a toy might be made of. With the most varied body shapes of all Druskenvald's species, each threadborn represents a unique representation of fun. They usually live for 100 years before falling apart and needing to be rebuilt.</p>"
  },
  "graveborn": {
    "name": "Graveborn",
    "pronunciation": "",
    "province": "syndramas",
    "image": "species/SPECIES_Graveborn.png",
    "body": "<p class=\"panel-body\">Graveborn are a ghoul-like species native to Syndramas, typically rising from one of the countless graves that mark the frozen battlefields of the province. They were first created in a kingdom-wide ritual that twisted countless humans into new Undead creatures that barely resembled who they once were. Graveborn now wage war endlessly and perpetuate a culture of martial prowess, relentlessness, and grave honor. These people are infused with the necrotic and draconic essence of the powerful drakkonite metal found throughout the province, which has given them a strange taste for spoiled flesh of any variety.</p><p class=\"panel-body\">Appearing as the corpses of twisted humanoids, graveborn have powerful snouts and jaws with elongated teeth and tongues that assist in the devouring of flesh and bone. Their physiology is sturdy, as if magically designed to be perfected for war. If not killed in war, as befalls many of their kind, they can live up to 300 years before decaying away.</p>"
  },
  "bogborn": {
    "name": "Bogborn",
    "pronunciation": "",
    "province": "zulrogg",
    "image": "species/SPECIES_Bogborn.png",
    "body": "<p class=\"panel-body\">Bogborn are a troll-like species native to Zulrogg, usually rising from the still, dark waters of the swampy province. From the moment of rebirth, they have a symbiotic relationship with the flora and fauna of the wild — and often treacherous — mire. Their ability to survive is further enhanced by the naturally regenerative biology often found in trolls.</p><p class=\"panel-body\">Towering over most, these hearty folk can face any trial of nature, and they often utilize their athleticism in pursuits of hunting and survival. Bearing prominent noses and tusks, their tough hides are generally shades of green or blue. Bogborn typically live 100 years before moving on to the spirit world.</p>"
  }
};
