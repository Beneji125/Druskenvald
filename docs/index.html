<!DOCTYPE html>
<html lang="en">
<head>

<title>Druskenvald — The Land Between Life and Death</title>

<meta name="description" content="An interactive lore map of Druskenvald, a gothic realm between life and death. Explore its thirteen provinces, native species, and hidden corners like Wickermoor Hollow.">
<meta name="theme-color" content="#0d0a07">

<!-- og:image/og:url use a relative path — update to an absolute URL once
     this is hosted (e.g. https://<user>.github.io/<repo>/CrookedMoon_Cover.jpg)
     for reliable link-preview unfurling on Discord/Twitter/etc. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Druskenvald — The Land Between Life and Death">
<meta property="og:description" content="An interactive lore map of Druskenvald, a gothic realm between life and death. Explore its thirteen provinces, native species, and hidden corners like Wickermoor Hollow.">
<meta property="og:image" content="CrookedMoon_Cover.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' font-size='90'><text y='.9em'>🌙</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<style>
/* ─── RESET & BASE ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:        #0d0a07;
    --panel-bg:   #12100d;
    --panel-mid:  #1c1610;
    --gold:       #c9a96e;
    --gold-dim:   #8a6e42;
    --crimson:    #7a3b2e;
    --crimson-lt: #a04d3c;
    --oak:        #3d2a1a;
    --cream:      #e8d5a3;
    --cream-dim:  #b8a07a;
    --shadow:     rgba(0,0,0,0.85);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--ink);
    color: var(--cream);
    font-family: 'IM Fell English', serif;
    overflow: hidden;
  }

  /* ─── TITLE SCREEN ─────────────────────────────────────────── */
  #title-screen {
    position: fixed; inset: 0; z-index: 100;
    background:
      linear-gradient(rgba(10,8,6,0.6), rgba(10,8,6,0.6)),
      url('CrookedMoon_Cover.jpg') center center / cover no-repeat;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2rem;
    transition: opacity 0.8s ease;
  }
  #title-screen.fade-out { opacity: 0; pointer-events: none; }

  .title-ornament {
    color: var(--gold-dim);
    font-size: 1.4rem;
    letter-spacing: 0.4em;
    font-family: 'Cinzel', serif;
    text-transform: uppercase;
  }

  .title-main {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(2.2rem, 6vw, 5rem);
    color: var(--cream);
    text-align: center;
    line-height: 1.2;
    text-shadow: 0 0 40px rgba(201,169,110,0.3), 0 2px 4px rgba(0,0,0,0.9);
  }

  .title-subtitle {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--gold-dim);
    letter-spacing: 0.1em;
  }

  .title-divider {
    width: 300px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
  }

  .enter-btn {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    background: transparent;
    padding: 0.75rem 2.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 1rem;
  }
  .enter-btn:hover {
    background: rgba(201,169,110,0.08);
    border-color: var(--gold);
    color: var(--cream);
  }

  /* ─── MAIN APP ─────────────────────────────────────────────── */
  #app {
    position: fixed; inset: 0;
    opacity: 0; transition: opacity 0.8s ease;
    display: flex; flex-direction: column;
  }
  #app.visible { opacity: 1; }

  /* ─── TOP BAR ──────────────────────────────────────────────── */
  #topbar {
    flex-shrink: 0;
    background: linear-gradient(to bottom, #0a0806, transparent);
    padding: 0.6rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 10;
  }

  #topbar-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.9rem, 2vw, 1.3rem);
    color: var(--cream);
    letter-spacing: 0.05em;
  }

  #breadcrumb {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    display: flex; align-items: center; gap: 0.5rem;
  }

  #back-btn {
    display: none;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    background: none; border: none;
    cursor: pointer;
    padding: 0.3rem 0.6rem;
    border: 1px solid var(--gold-dim);
    transition: all 0.2s;
  }
  #back-btn:hover { background: rgba(201,169,110,0.08); }
  #back-btn.visible { display: block; }

  .icon-btn {
    font-size: 0.85rem;
    color: var(--gold);
    background: none;
    cursor: pointer;
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--gold-dim);
    line-height: 1;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: rgba(201,169,110,0.08); }

  /* One cohesive widget rather than a loose row of controls sitting
     directly in the breadcrumb — a faint panel with its own internal
     rhythm, so it reads as "the player" at a glance. */
  .music-player {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.25rem 0.6rem;
    border: 1px solid rgba(138,110,66,0.35);
    background: rgba(0,0,0,0.18);
    border-radius: 2px;
  }

  /* Volume — gold, round thumb (matches the mute button's icon color it
     sits next to). Kept visually distinct from the waveform seek bar
     (crimson bars) so the two controls aren't mistaken for one another. */
  #music-volume-slider {
    width: 56px;
    height: 2px;
    accent-color: var(--gold);
    cursor: pointer;
    background: var(--gold-dim);
    vertical-align: middle;
    transition: opacity 0.2s;
  }
  #music-volume-slider:hover { opacity: 0.85; }
  #music-volume-slider::-webkit-slider-thumb {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
  }
  #music-volume-slider::-moz-range-thumb {
    width: 10px; height: 10px;
    border: none;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
  }

  /* Waveform seek bar — a static, decorative bar pattern (not derived from
     the actual audio) that fills in left-to-right as the track plays; see
     buildWaveformBars()/updateWaveformProgress() in app.js. Click or drag
     anywhere on it to seek. */
  .music-waveform {
    width: 110px;
    height: 22px;
    cursor: pointer;
    touch-action: none; /* so dragging to seek doesn't also scroll on touch */
  }
  .music-waveform:hover .wf-bar { opacity: 0.85; }
  .wf-bar {
    fill: var(--gold-dim);
    transition: fill 0.12s linear, opacity 0.15s;
  }
  .wf-bar.played { fill: var(--crimson-lt); }

  .music-time {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    color: var(--gold-dim);
    white-space: nowrap;
    /* A flex item with no explicit width sizes to fit its own content, so
       `min-width` alone is only a floor — once the minutes digit rolls
       over into double digits (e.g. 9:59 -> 10:00, easily reached by the
       longer Wickermoor tracks), the text outgrows that floor and the
       element — and everything after it in .music-player — shifts. A
       fixed `width` (generous enough for up to "99:59 / 99:59", tracks
       this site will never actually have) plus flex-shrink:0 makes the
       box's size constant regardless of what digits are showing, so
       tabular-nums here is just making the digits *within* that fixed
       box stop jittering too, not doing the layout-stability work alone. */
    font-variant-numeric: tabular-nums;
    width: 6.5em;
    flex-shrink: 0;
    text-align: center;
  }

  .music-now-playing {
    font-style: italic;
    color: var(--cream-dim);
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .music-now-playing:empty { display: none; }

  /* Reset-to-default-track button — same show/hide pattern as #back-btn:
     hidden until a location track is actually playing (see
     toggleLocationTrack/resetToDefaultTrack in app.js), since there's
     nothing to "return" to otherwise. */
  #music-reset-btn {
    display: none;
    font-size: 0.75rem;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.2s, transform 0.2s;
  }
  #music-reset-btn.visible { display: inline-block; opacity: 1; transform: scale(1); }

  /* ─── MAP CONTAINER ────────────────────────────────────────── */
  #map-wrapper {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
  }
  #map-wrapper.panning { cursor: grabbing; }

  .map-layer {
    position: absolute; inset: 0;
    transition: opacity 0.5s ease;
  }
  /* visibility:hidden as well as pointer-events:none: a defensive belt-and-
     suspenders pair, in case any descendant ever sets its own pointer-events
     (overriding the ancestor's none via inheritance) — without it, a hidden
     layer's hotspots could intercept clicks meant for whichever layer is
     actually visible underneath it. */
  .map-layer.hidden { opacity: 0; pointer-events: none; visibility: hidden; }

  /* Zoom/pan transform target — a single transform on this wrapper scales
     and translates the img/canvases/svg together, so their existing mutual
     alignment (and native browser hit-testing on the SVG hotspots) is
     preserved automatically with no coordinate-math changes elsewhere. */
  .zoom-layer {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
  }

  /* ─── ZOOM CONTROLS ────────────────────────────────────────── */
  #zoom-controls {
    position: absolute;
    right: 1.2rem; bottom: 1.2rem;
    z-index: 20;
    display: flex; flex-direction: column;
    gap: 0.4rem;
  }
  .zoom-btn {
    width: 2.3rem; height: 2.3rem;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--gold);
    background: rgba(13,10,7,0.85);
    border: 1px solid var(--gold-dim);
    cursor: pointer;
    transition: all 0.2s;
  }
  .zoom-btn:hover {
    background: rgba(201,169,110,0.12);
    border-color: var(--gold);
    color: var(--cream);
  }
  .zoom-btn.active {
    background: rgba(201,169,110,0.28);
    border-color: var(--cream);
    color: var(--cream);
  }
  .zoom-controls-divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    margin: 0.15rem 0;
  }

  .map-img {
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }

  /* ─── SVG HOTSPOT SYSTEM ───────────────────────────────────── */
  /* Must mirror the .map-img's object-fit:contain box exactly so that
     SVG path coordinates (0-100 normalized) line up pixel-for-pixel
     with the underlying image regardless of container aspect ratio. */
  .hotspot-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 3;
  }
  /* <canvas> has no native equivalent to object-fit/preserveAspectRatio, so
     unlike the <img> (object-fit:contain) and <svg> (viewBox +
     preserveAspectRatio="xMidYMid meet") layers it shares this class with,
     a canvas's pixel buffer stretches to fill this box by default —
     misaligning it from the letterboxed map art whenever the container's
     aspect ratio doesn't match the map's. Forcing the same "contain"
     behavior here keeps it pinned to the same content box as the other two. */
  canvas.hotspot-svg {
    object-fit: contain;
    object-position: center;
  }

  .hotspot-poly {
    fill: rgba(201,169,110,0);
    stroke: rgba(201,169,110,0);
    stroke-width: 0.15;
    cursor: pointer;
    transition: fill 0.2s ease, stroke 0.2s ease;
    vector-effect: non-scaling-stroke;
  }
  .hotspot-poly:hover {
    fill: rgba(201,169,110,0.16);
    stroke: rgba(201,169,110,0.5);
  }

  /* Tooltip for SVG hotspots */
  #svg-tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(13,10,7,0.95);
    border: 1px solid var(--gold-dim);
    color: var(--cream);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.35rem 0.7rem;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 60;
    white-space: nowrap;
    transform: translate(-50%, -130%);
  }
  #svg-tooltip.show { opacity: 1; }

  /* ─── LORE PANEL ───────────────────────────────────────────── */
  #lore-panel {
    position: fixed;
    top: 0; right: 0;
    width: min(480px, 100vw);
    height: 100vh;
    background: linear-gradient(160deg, #1a1208 0%, #0f0c08 60%, #0d0a07 100%);
    border-left: 1px solid var(--oak);
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 50;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #lore-panel.open { transform: translateX(0); }

  /* Panel decorative top border */
  .panel-border-top {
    height: 3px;
    background: linear-gradient(to right, transparent, var(--crimson), var(--gold-dim), var(--crimson), transparent);
    flex-shrink: 0;
  }

  #panel-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: none; border: none;
    color: var(--gold-dim); font-size: 1.2rem;
    cursor: pointer; z-index: 2;
    width: 2rem; height: 2rem;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s;
    font-family: 'Cinzel', serif;
  }
  #panel-close:hover { color: var(--cream); }

  #panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.8rem 2rem;
    scrollbar-width: thin;
    scrollbar-color: var(--oak) transparent;
  }
  #panel-content::-webkit-scrollbar { width: 4px; }
  #panel-content::-webkit-scrollbar-track { background: transparent; }
  #panel-content::-webkit-scrollbar-thumb { background: var(--oak); border-radius: 2px; }

  /* Clickable species mentions within province lore */
  .species-link {
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 3px;
    transition: color 0.2s;
  }
  .species-link:hover { color: var(--gold); }

  /* ─── SPECIES PANEL (secondary panel, slides in from the left) ──── */
  #species-panel,
  #npc-panel {
    position: fixed;
    top: 0; left: 0;
    width: min(420px, 100vw);
    height: 100vh;
    background: linear-gradient(200deg, #1a1208 0%, #0f0c08 60%, #0d0a07 100%);
    border-right: 1px solid var(--oak);
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 52;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #species-panel.open,
  #npc-panel.open { transform: translateX(0); }

  #species-panel-close,
  #npc-panel-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: none; border: none;
    color: var(--gold-dim); font-size: 1.2rem;
    cursor: pointer; z-index: 2;
    width: 2rem; height: 2rem;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s;
    font-family: 'Cinzel', serif;
  }
  #species-panel-close:hover,
  #npc-panel-close:hover { color: var(--cream); }

  #species-panel-content,
  #npc-panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.8rem 2rem;
    scrollbar-width: thin;
    scrollbar-color: var(--oak) transparent;
  }
  #species-panel-content::-webkit-scrollbar,
  #npc-panel-content::-webkit-scrollbar { width: 4px; }
  #species-panel-content::-webkit-scrollbar-track,
  #npc-panel-content::-webkit-scrollbar-track { background: transparent; }
  #species-panel-content::-webkit-scrollbar-thumb,
  #npc-panel-content::-webkit-scrollbar-thumb { background: var(--oak); border-radius: 2px; }

  #species-overlay,
  #npc-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 51;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  #species-overlay.show,
  #npc-overlay.show { opacity: 1; pointer-events: all; }

  /* Clickable NPC name mentioned inline in a Wickermoor location/being's
     own lore text (see openNpcPanel in app.js) — same visual treatment as
     .species-link in province lore, so both read as "this is a clickable
     term" consistently across the whole site. */
  .npc-link {
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 3px;
    transition: color 0.2s;
  }
  .npc-link:hover { color: var(--crimson-lt); }

  /* ─── PANEL TYPOGRAPHY ─────────────────────────────────────── */
  .panel-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--crimson-lt);
    margin-bottom: 0.5rem;
  }

  .panel-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    color: var(--cream);
    line-height: 1.2;
    margin-bottom: 0.3rem;
    padding-right: 2rem;
  }

  .panel-pronunciation {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--gold-dim);
    margin-bottom: 1rem;
  }

  .panel-image-frame {
    width: 100%;
    margin-bottom: 1.2rem;
    border: 1px solid var(--oak);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
  }
  .panel-image-frame::after {
    content: '';
    position: absolute; inset: 0;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .panel-image {
    width: 100%;
    height: auto;
    display: block;
  }

  .panel-image-placeholder {
    width: 100%;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1c1610, #0d0a07);
    border: 1px solid var(--oak);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
    position: relative;
    overflow: hidden;
  }
  .panel-image-placeholder::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 20px,
      rgba(61,42,26,0.15) 20px,
      rgba(61,42,26,0.15) 21px
    );
  }
  .placeholder-icon {
    font-size: 2rem;
    color: var(--oak);
    position: relative; z-index: 1;
  }
  .placeholder-text {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    opacity: 0.5;
    position: relative; z-index: 1;
  }

  .panel-divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--oak), transparent);
    margin: 1rem 0;
  }

  .panel-quote {
    font-style: italic;
    font-size: 0.9rem;
    color: var(--cream-dim);
    line-height: 1.6;
    border-left: 2px solid var(--crimson);
    padding-left: 1rem;
    margin-bottom: 1rem;
  }
  .panel-quote cite {
    display: block;
    margin-top: 0.4rem;
    font-size: 0.75rem;
    color: var(--gold-dim);
    font-style: normal;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.05em;
  }

  .panel-body {
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--cream-dim);
    margin-bottom: 1rem;
  }

  .panel-section-title {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 1.2rem 0 0.5rem;
  }

  .panel-subsection-title {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--crimson-lt);
    margin: 0.9rem 0 0.3rem;
  }

  /* Titles embedded inline within a byGroup entry's own narrative text
     (WM_LORE in data/descriptions.json), marking a distinct story beat
     within that group's revealed lore — e.g. "Need a Hand?" ahead of one
     paragraph of a longer group-1 recap. Same visual language as
     .panel-subsection-title above, since it plays the same role, just
     authored as a plain <p> alongside .panel-body paragraphs rather than
     a separate <div>. */
  .panel-subheader {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--crimson-lt);
    margin: 2rem 0 0.5rem;
  }

  .panel-body strong {
    color: var(--cream);
    font-style: normal;
  }

  .panel-body ul {
    list-style: none;
    padding-left: 0;
    margin-top: 0.4rem;
  }
  .panel-body ul li {
    padding-left: 1.2rem;
    position: relative;
    margin-bottom: 0.5rem;
  }
  .panel-body ul li::before {
    content: '✦';
    position: absolute; left: 0;
    color: var(--crimson);
    font-size: 0.6rem;
    top: 0.3rem;
  }

  .species-tag {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold-dim);
    border: 1px solid var(--oak);
    padding: 0.2rem 0.6rem;
    margin-bottom: 1rem;
  }

  /* ─── PASSWORD SECTION ─────────────────────────────────────── */
  .password-section {
    margin-top: 1.5rem;
    padding: 1rem 1.2rem;
    border: 1px solid var(--oak);
    background: rgba(13,10,7,0.5);
    position: relative;
  }
  .password-section::before {
    content: '🔒';
    position: absolute; top: -0.7rem; left: 1rem;
    background: var(--panel-bg);
    padding: 0 0.4rem;
    font-size: 0.8rem;
  }

  .password-label {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 0.6rem;
  }

  .password-flavor {
    font-style: italic;
    font-size: 0.8rem;
    color: var(--cream-dim);
    opacity: 0.7;
    margin-bottom: 0.8rem;
    line-height: 1.5;
  }

  .password-input-row {
    display: flex; gap: 0.5rem;
  }

  .password-input {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--oak);
    color: var(--cream);
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    padding: 0.4rem 0.7rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .password-input:focus { border-color: var(--gold-dim); }
  .password-input::placeholder { color: var(--gold-dim); opacity: 0.4; }

  .password-btn {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: var(--crimson);
    color: var(--cream);
    border: none;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .password-btn:hover { background: var(--crimson-lt); }

  .password-error {
    font-size: 0.7rem;
    color: var(--crimson-lt);
    margin-top: 0.4rem;
    font-style: italic;
    display: none;
  }
  .password-error.show { display: block; }

  .locked-content { display: none; }
  .locked-content.unlocked { display: block; }

  /* Topbar "re-enter a character's name" widget — a popover off the 👤
     button, rather than a persistent input, so it doesn't compete for
     space with the music player. Reuses .password-input/.password-btn/
     .password-error for a consistent look with the per-location prompts. */
  #reenter-name-widget { position: relative; }
  #reenter-name-prompt {
    display: none;
    position: absolute;
    top: calc(100% + 0.6rem);
    right: 0;
    z-index: 20;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    width: 220px;
    background: var(--panel-bg);
    border: 1px solid var(--gold-dim);
    padding: 0.7rem;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
  }
  #reenter-name-prompt.open { display: flex; }
  #reenter-name-prompt .password-input { flex: 1 1 auto; min-width: 0; }
  #reenter-name-prompt .password-error { flex-basis: 100%; margin-top: 0; }

  /* ─── WICKERMOOR AMBIENCE TRACK PLAYER ────────────────────────── */
  .wm-track-player { margin: 0.8rem 0; }
  .wm-track-btn {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 0.45rem 0.9rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .wm-track-btn:hover { border-color: var(--gold); color: var(--cream); }
  .wm-track-btn.playing {
    background: var(--gold-dim);
    color: var(--cream);
    border-color: var(--gold);
  }

  /* ─── WICKERMOOR LOCKED STATE ──────────────────────────────── */
  .wm-location-entry {
    padding: 0.8rem 1rem;
    border: 1px solid var(--oak);
    background: rgba(0,0,0,0.3);
    margin-bottom: 0.6rem;
  }
  .wm-location-name {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 0.3rem;
  }
  .wm-location-locked {
    font-style: italic;
    font-size: 0.8rem;
    color: var(--cream-dim);
    opacity: 0.5;
  }

  /* ─── OVERLAY (panel backdrop) ─────────────────────────────── */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 49;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  #overlay.show { opacity: 1; pointer-events: all; }

  /* ─── RESPONSIVE ───────────────────────────────────────────── */
  @media (max-width: 600px) {
    #lore-panel { width: 100vw; }
    #species-panel { width: 100vw; }
  }

  /* ─── CORNER ORNAMENTS ─────────────────────────────────────── */
  .corner-ornament {
    position: fixed;
    width: 60px; height: 60px;
    opacity: 0.15;
    pointer-events: none;
    z-index: 5;
  }
  .corner-tl { top: 0; left: 0; }
  .corner-tr { top: 0; right: 0; transform: scaleX(-1); }
  .corner-bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .corner-br { bottom: 0; right: 0; transform: scale(-1); }

  /* ─── NIGHT ATMOSPHERE ─────────────────────────────────────── */
  /* All night/moonlight darkening is handled by buildLightingCanvas()
     using a <canvas> element with destination-out compositing — the
     correct technique for punching clean holes in a darkness layer.
     See buildLightingCanvas() in the script. */
</style>
</head>
<body>

<!-- ═══ TITLE SCREEN ═══════════════════════════════════════════ -->
<div id="title-screen">
  <div class="title-ornament">— The Crooked Moon —</div>
  <div class="title-divider"></div>
  <h1 class="title-main">Druskenvald</h1>
  <p class="title-subtitle">The Land Between Life and Death</p>
  <div class="title-divider"></div>
  <button class="enter-btn" onclick="enterSite()">Enter the Realm</button>
</div>

<!-- ═══ MAIN APP ════════════════════════════════════════════════ -->
<div id="app">

  <!-- Top Bar -->
  <div id="topbar">
    <div id="topbar-title">Druskenvald</div>
    <div id="breadcrumb">
      <span id="breadcrumb-text">The Thirteen Provinces</span>
      <div class="music-player">
        <button id="music-toggle-btn" class="icon-btn" onclick="toggleMusic()" title="Mute music">🔊</button>
        <input type="range" id="music-volume-slider" min="0" max="1" step="0.01" oninput="setMusicVolume(this.value)" title="Music volume">
        <span id="music-now-playing" class="music-now-playing"></span>
        <button id="music-reset-btn" class="icon-btn" onclick="resetToDefaultTrack()" title="Return to Creaking Bones">⟲</button>
        <!-- Stylized waveform seek bar — bars are generated once by
             buildWaveformBars() (app.js) into #music-waveform-bars, then
             re-colored (not re-laid-out) on each timeupdate to show
             progress, and clicking/dragging seeks. preserveAspectRatio
             "none" lets the viewBox stretch to whatever width the CSS
             gives the element, no JS resize handling needed. -->
        <svg id="music-waveform" class="music-waveform" viewBox="0 0 200 28" preserveAspectRatio="none" title="Seek">
          <g id="music-waveform-bars"></g>
        </svg>
        <span id="music-time" class="music-time">0:00 / 0:00</span>
      </div>
      <!-- Re-enter a character's name at any time — not just the first-ever
           unlock, which otherwise only happens contextually through a
           locked panel's own password box. See toggleReenterNamePrompt()/
           submitReenterName() in app.js. -->
      <div id="reenter-name-widget">
        <button id="reenter-name-btn" class="icon-btn" onclick="toggleReenterNamePrompt()" title="Enter a character's name">👤</button>
        <div id="reenter-name-prompt">
          <input type="text" id="reenter-name-input" class="password-input" placeholder="Enter a character's name…" onkeydown="if(event.key==='Enter') submitReenterName()">
          <button class="password-btn" onclick="submitReenterName()">Confirm</button>
          <div class="password-error" id="reenter-name-error"></div>
        </div>
      </div>
      <button id="back-btn" onclick="returnToMain()">↩ Return to Druskenvald</button>
    </div>
  </div>

  <!-- The single site-wide audio channel: the looping background track by
       default, or (see toggleLocationTrack() in app.js) a Wickermoor
       location's ambience track while one is playing — there is no
       separate/second player, starting a location track just takes over
       this element and the topbar controls above, then hands back to the
       default track when paused or finished.
       preload="none": don't fetch the 7MB default track until initMusic()
       actually plays it (on entering the site, and only if not already
       muted). -->
  <audio id="bg-music" src="audio/Creaking_Bones.mp3" loop preload="none"></audio>

  <!-- Map Wrapper -->
  <div id="map-wrapper">

    <!-- ── DRUSKENVALD MAP LAYER ── -->
    <div id="layer-main" class="map-layer">
      <div class="zoom-layer" id="zoom-layer-main">
        <img src="MAP_Druskenvald.jpeg" alt="Map of Druskenvald" class="map-img" id="main-map-img">
        <canvas id="lighting-canvas" class="hotspot-svg" style="pointer-events:none;"></canvas>
        <!-- mix-blend-mode:color — replaces the hue/saturation of everything
             beneath it (map art + the darkness canvas above) with this
             canvas's own color, at each pixel's own alpha, while preserving
             what's below's luminosity. A canvas's internal
             globalCompositeOperation can only blend against content already
             drawn on that same canvas, not the separate <img> beneath it —
             this is what actually makes a light's color read as the area
             genuinely being lit by that color, rather than a translucent
             wash sitting on top of the map's own painted colors. -->
        <canvas id="tint-canvas" class="hotspot-svg" style="pointer-events:none; mix-blend-mode:color;"></canvas>
        <canvas id="hover-canvas"    class="hotspot-svg" style="pointer-events:none; opacity:0; transition:opacity 0.25s ease;"></canvas>
        <svg id="hotspots-main-svg" class="hotspot-svg" viewBox="0 0 3000 1953" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>

    <!-- ── WICKERMOOR HOLLOW MAP LAYER ── -->
    <!-- data-src, not src: this 3MB image is only fetched the first time
         openWickermoor() is called, not on initial page load. Mirrors the
         main map layer's canvas/svg structure — viewBox height is 1951, not
         1953, matching this image's actual pixel dimensions (see
         MAP_LAYERS.wickermoor in app.js). -->
    <div id="layer-wickermoor" class="map-layer hidden">
      <div class="zoom-layer" id="zoom-layer-wickermoor">
        <img data-src="MAP_Wickermoor_Hollow.jpeg" alt="Map of Wickermoor Hollow" class="map-img" id="wickermoor-map-img">
        <canvas id="wickermoor-lighting-canvas" class="hotspot-svg" style="pointer-events:none;"></canvas>
        <canvas id="wickermoor-tint-canvas" class="hotspot-svg" style="pointer-events:none; mix-blend-mode:color;"></canvas>
        <canvas id="wickermoor-hover-canvas"    class="hotspot-svg" style="pointer-events:none; opacity:0; transition:opacity 0.25s ease;"></canvas>
        <svg id="hotspots-wickermoor-svg" class="hotspot-svg" viewBox="0 0 3000 1951" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>

    <!-- Zoom & Light Mode Controls -->
    <div id="zoom-controls">
      <button class="zoom-btn" id="light-mode-btn" onclick="toggleLightMode()" title="Toggle light mode">💡</button>
      <div class="zoom-controls-divider"></div>
      <button class="zoom-btn" id="zoom-in-btn" onclick="zoomIn()" title="Zoom in">+</button>
      <button class="zoom-btn" id="zoom-out-btn" onclick="zoomOut()" title="Zoom out">−</button>
      <button class="zoom-btn" id="zoom-reset-btn" onclick="resetZoomView()" title="Reset zoom">⟲</button>
    </div>

  </div>

  <!-- Overlay -->
  <div id="overlay" onclick="closePanel()"></div>

  <!-- SVG hotspot tooltip -->
  <div id="svg-tooltip"></div>

  <!-- Lore Panel -->
  <div id="lore-panel">
    <div class="panel-border-top"></div>
    <button id="panel-close" onclick="closePanel()" title="Close">✕</button>
    <div id="panel-content"></div>
  </div>

  <!-- Species Overlay -->
  <div id="species-overlay" onclick="closeSpeciesPanel()"></div>

  <!-- Species Panel -->
  <div id="species-panel">
    <div class="panel-border-top"></div>
    <button id="species-panel-close" onclick="closeSpeciesPanel()" title="Close">✕</button>
    <div id="species-panel-content"></div>
  </div>

  <!-- NPC Overlay/Panel — same secondary-panel pattern as the species
       panel above (see openNpcPanel/closeNpcPanel in app.js), for
       clicking a named NPC mentioned inside a Wickermoor location/being's
       own lore text. A separate panel rather than reusing the species one
       outright, since the two can in principle be triggered from
       different underlying panels and shouldn't fight over the same DOM. -->
  <div id="npc-overlay" onclick="closeNpcPanel()"></div>
  <div id="npc-panel">
    <div class="panel-border-top"></div>
    <button id="npc-panel-close" onclick="closeNpcPanel()" title="Close">✕</button>
    <div id="npc-panel-content"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════

// DATA — generated from src/data/descriptions.json and src/data/hotspots.json

// Edit those files, not this block.

// ═══════════════════════════════════════════════════════════════

const SCENE_IMAGES = {
  "ardengloom": "scenes/SCENE_Province_Ardengloom.jpeg",
  "astramar": "scenes/SCENE_Province_Astramar.jpeg",
  "bubonia": "scenes/SCENE_Province_Bubonia.jpeg",
  "chernabos": "scenes/SCENE_Province_Chernabos.jpeg",
  "edwardia": "scenes/SCENE_Province_Edwardia.jpeg",
  "enoch": "scenes/SCENE_Province_Enoch.jpeg",
  "kalero": "scenes/SCENE_Province_Kalero.jpeg",
  "nerukhet": "scenes/SCENE_Province_Neruketh.jpeg",
  "olmarsh": "scenes/SCENE_Province_Olmarsh.jpeg",
  "pholsense": "scenes/SCENE_Province_Pholsense.jpeg",
  "picco": "scenes/SCENE_Province_Picco.jpeg",
  "syndramas": "scenes/SCENE_Province_Syndramas.jpeg",
  "zulrogg": "scenes/SCENE_Province_Zulrogg.jpeg",
  "ghostlight_express": "scenes/SCENE_Chapter8_Ghostlight_Express.jpeg",
  "crooked_moon": "scenes/SCENE_Chapter8_The_Crooked_Moon.jpeg",
  "druskenvald": "chapter-art/Introducting Druskenvald.jpeg"
};

const LORE = {
  "druskenvald": {
    "eyebrow": "The Land Between Life and Death",
    "title": "Druskenvald",
    "pronunciation": "DRUSK-in-vahld",
    "quote": "A self-contained demiplane where the living, dead, and everything in between can coexist.",
    "quoteAttrib": "",
    "body": "<p class=\"panel-body\">Druskenvald is a realm that exists outside the lands of the mortal and material. Enveloped in a seemingly endless expanse of eldritch gloom, it exists in a paradoxical state of limbo between the warring furies of life and death. Beyond the misty borders of this domain may lie countless worlds and afterlives, but Druskenvald stands apart, a self-contained demiplane where the living, dead, and everything in between can coexist.</p>\n<p class=\"panel-body\">Within these confines is a landmass hewn into the shape of a crescent moon and a dark and roiling sea that stretches from its eastern coastline until it disappears into the haze. Looming mountain peaks to the north and south flank the lands between, forming an enormous continent-sized valley that nonsensically spans numerous environments in a relatively short distance and never experiences the turn of a season. The laws of nature and logic have no dominion over a place that is just as much nightmare and folktale as it is a land to explore.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">The Thirteen Provinces</div>\n<p class=\"panel-body\">The mystifying nature of Druskenvald is made most apparent by the thirteen major provinces that comprise it. As if pulled from a child's storybook featuring a broad collection of varying tales, each of these territories has a wholly distinct biome, topography, and climate. From forest to moor, desert to tundra, swamp to farmland, they all exist side by side like a collection of bizarre patches stitched together upon a grandmother's quilt. Despite the uniqueness of each Druskenvaldian patch, travel between provinces is not especially difficult, and borders can be crossed with a simple step.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Phillip & Adela Druskenvald</div>\n<div class=\"panel-image-frame\"><img src=\"scenes/SCENE_Chapter8_Tarot_Reading.jpeg\" alt=\"Phillip and Adela Druskenvald\" class=\"panel-image\"></div>\n<p class=\"panel-body\">Since coming to power, Phillip Druskenvald has attempted to shape the realm he named after himself into a reflection of his own ideals. A master of unchained ambitions, he envisions a realm where civilization crushes the wild pulse of nature, where order reigns supreme over the primal chaos of the afterlife. In his mind, he has crafted a sanctuary, a place where souls are reborn into lives filled with the pleasures and comforts they once knew, no longer bound by the harsh cycles of nature.</p>\n<p class=\"panel-body\">In Phillip's eyes, he is a benevolent ruler who has given the inhabitants of Druskenvald a second chance at life, which he believes to be the ultimate desire of every mortal. However, as the years have gone on, he has become out of touch with the people for whom he is responsible. Often aloof and completely unaware of the realities of living in Druskenvald, he presumes that the inhabitants of Druskenvald are having as good and easy a time as he is.</p>\n<p class=\"panel-body\">At Phillip's side stands his beloved wife Adela (uh-DELL-uh), the most precious soul in existence to him. Adela was once a mortal woman living in the material world, but one born with immense powers of divination and prophecy. Her unbound curiosity, enthusiasm, and drive, along with an obsession with the spiritual world, drew her to seek out the Ghostlight Express. It is there she met Phillip, and the two fell deeply in love and were promptly married. She now assists her husband and is invaluable in the governance of Druskenvald.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">The Shroud</div>\n<p class=\"panel-body\">No matter the power of the beings that dwell in Druskenvald, virtually none can pierce the wall of fog that encircles it. The phantom gloom, known among the inhabitants of Druskenvald as the Shroud, appears as a dense gray mist that wails in a chorus of agonized voices. The Shroud is, in reality, the condensed essence of the primordial element of death itself given form. It lingers just beyond the fringes of the mortal realms and serves as the veil that separates the lands of the living and the dead.</p>\n<p class=\"panel-body\">All souls not offered salvation by the hallowed or delivered damnation by the hells must pass through the Shroud on their way to the afterlife to which they are destined. They must first be led through the mist by the Strangers, timeless beings with the power to safely guide the dead to the other side. While these entities use many methods and take many forms, such as shepherds, ferrymen, reapers, or angels of death, all are bound to their solemn duty for eternity. Without the protective shield of a Stranger, the phantom mist annihilates wayward souls and devours their anima, the quintessential soul-stuff that provides all beings spiritual identity and sentience.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Rebirth & the Fate of Souls</div>\n<p class=\"panel-body\">Souls that arrive in Druskenvald are reborn into a wide variety of species, including those which inhabit the world of the living. However, the realm's predominant populace is comprised of thirteen distinct species, each having originated from one of the thirteen shrouded provinces. The origins of these species are as varied as the land itself, some rising from the landscape, others being crafted by the provincial lords, and still more arriving from magical phenomena, emerging into Druskenvald as fully formed adults, infants, or any age in between. In just as many instances, the rebirth is initiated by two parents seeking a child through biological, magical, or technological means.</p>\n<p class=\"panel-body\">No matter the species, most inhabitants of Druskenvald emerge anew, their memories of a past life erased, allowing them to live their next life with a clean slate. A few cling to fragments of their former selves, their memories either shrouded in mist or vivid and unyielding. Even rarer are those with a fully clear picture of their past life, even remembering their moment of death. While many of these beings remain in their province of origin, others choose to roam across Druskenvald and settle in other communities.</p>\n<p class=\"panel-body\">Besides the thirteen species native to Druskenvald, humans are the most populous species found in the realm compared to other folk such as dwarves, elves, or halflings. This is due to the deep connection that Phillip and Adela Druskenvald have to the domain they rule. Despite having become deathless, immortal beings long ago, their once-human hearts have left a clear imprint upon the land.</p>\n<p class=\"panel-body\">There is no guarantee of the fate that befalls those who die again while in the confines of this realm of rebirth. For many, the cycle starts once more, and the soul of the recently deceased is reborn as one of the species of Druskenvald. Sometimes, they return as the same species they had been in life, but just as often, they awaken as an entirely different one.</p>\n<p class=\"panel-body\">Some experience a \"Final Death,\" where the soul simply fades into oblivion and ceases to exist. For those who were particularly wicked in their second chance at life, the Shroud claims it. The soul's anima is devoured, and the spirit is transformed into a shrieking abomination doomed to wander the eldritch fog forever.</p>"
  },
  "crooked_moon": {
    "eyebrow": "The Eternal Sky",
    "title": "The Crooked Moon",
    "pronunciation": "",
    "quote": "In Druskenvald, the sun never rises.",
    "quoteAttrib": "",
    "body": "<p class=\"panel-body\">In Druskenvald, the sun never rises. Instead, the land is bathed in an orange glow from the horizon for a few brief hours at the height of dusk, only to be swallowed by the encroaching darkness that dominates the rest of the night.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">The Moon's Phases</div>\n<p class=\"panel-body\">The Crooked Moon, an eternal crescent with the visage of a leering hag, hangs eternally overhead. Its light waxes and wanes with the cycle of each night as it moves through the sky with no discernible pattern, casting long, creeping shadows. At times, it looms large in the sky, its baleful eye glowering over the land with malicious intent. At other times, it shrinks to a small sliver nearly lost in the night sky, leaving the land blanketed in total darkness.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Marking the Hours</div>\n<p class=\"panel-body\">The people of Druskenvald have adapted to their peculiar 24-hour \"day\" cycle from the Twilight Hour through the Witching Hour, dividing their time according to the shifting light in their own ways. Some rise as soon as the golden glow of the hidden sun shows itself above the horizon and settle in before the most treacherous hours of night. Others only wake during true darkness. While they may not agree on how to honor Druskenvald's time, all peoples and provinces have aligned on the same naming conventions for the phases of each passing night.</p>"
  },
  "crescent_court": {
    "eyebrow": "The Ruling Council",
    "title": "The Crescent Court",
    "pronunciation": "",
    "quote": "Thirteen lords and ladies. Thirteen provinces. One fragile peace.",
    "quoteAttrib": "",
    "body": "<p class=\"panel-body\">The Druskenvalds do not rule the domain alone. There are thirteen major provinces, each with a lord or lady who governs and embodies the essence of their territory. Some of these nobles are members of the origin species of their province, while others, though different in form, still represent the province's spirit. These diverse leaders form the Crescent Court, a council that governs all of Druskenvald.</p>\n<p class=\"panel-body\">The nobles of the Crescent Court enjoy a significant degree of autonomy in the governance of their provinces with little direct oversight from Phillip. As long as each province maintains order and does not disrupt the affairs of neighboring provinces or the Druskenvalds themselves, the lords and ladies are free to rule as they see fit.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">The Thirteen Lords & Ladies</div>\n<p class=\"panel-body\">The lords and ladies are as varied as the provinces they govern, some wise, some ruthless, some ancient beyond reckoning, and at least one who finds the whole affair beneath him.</p>\n<ul class=\"panel-body\">\n  <li><strong>Elder Gallows</strong>, Ardengloom</li>\n  <li><strong>Headmistress Narcissa Voss</strong>, Astramar</li>\n  <li><strong>Doctor Molder Underfoot</strong>, Bubonia</li>\n  <li><strong>Ol' Mister Scratch</strong>, Chernabos</li>\n  <li><strong>Charlotte Heady, The Iron Maiden</strong>, Edwardia</li>\n  <li><strong>Methuselah</strong>, Enoch</li>\n  <li><strong>Catrina the Sweet</strong>, Kalero</li>\n  <li><strong>God King Xanatep</strong>, Nerukhet</li>\n  <li><strong>Captain Ephraim Wake</strong>, Olmarsh</li>\n  <li><strong>Archbishop Danton Alexandre Renault</strong>, Pholsense</li>\n  <li><strong>Blinski II</strong>, Picco</li>\n  <li><strong>Wyrm Queen Sapphira</strong>, Syndramas</li>\n  <li><strong>Tazri Swampcaller</strong>, Zulrogg</li>\n</ul>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Chateau Clair de Lune</div>\n<p class=\"panel-body\">Several times a year, the Crescent Court gathers at Chateau Clair de Lune (sha-TOH KLAIR-duh-LOON), the Druskenvalds' sprawling manor. The home was built by Phillip to Adela's exacting design, and it serves as an ideal place of residence and headquarters for the domain's leadership. When court is called, there is pageantry and celebration, but important matters are discussed and crucial decisions are made regarding the governance of Druskenvald.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">The Coven of the Midnight Moon</div>\n<p class=\"panel-body\">Oftentimes, the primary focus of the meetings is on the malefic machinations of the Coven of the Midnight Moon. This coven of thirteen witches is led by a powerful crone known as Mother Midnight. She and her daughters work in the shadows, terrorizing the thirteen major provinces of Druskenvald to some incomprehensible end.</p>"
  },
  "ghostlight_express": {
    "eyebrow": "The Way Between Worlds",
    "title": "The Ghostlight Express",
    "pronunciation": "",
    "quote": "Only the dead may see its arrival. Only the lucky reach its platform.",
    "quoteAttrib": "",
    "body": "<p class=\"panel-body\">The Ghostlight Express is the great train that carries departed souls from the mortal world into Druskenvald. It is the threshold between death and rebirth, a locomotive wreathed in spectral light that emerges from banks of dense fog with no warning and vanishes just as silently.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">The Arrival</div>\n<p class=\"panel-body\">In the mortal realms, the train's arrival is heralded by the haunting sound of a fiddle and strange whistles drifting in from nowhere. The Ghostlight Express rolls in on banks of dense fog, appearing seemingly from thin air. It is said that only the dead can truly perceive its arrival, but certain living souls have discovered ways to gain passage while still breathing. Whether this is a gift or a curse depends greatly on who you ask.</p>\n\n<div class=\"panel-section-title\">The Vagrant</div>\n<p class=\"panel-body\">The Ghostlight Express is operated by a figure known only as the Vagrant, a mirthful conductor whose fiddle playing and haunting whistles announce the train's arrival. He is the shepherd of souls, ferrying the departed through the mists and into their new lives in Druskenvald. The nature of the Vagrant, whether mortal, spirit, or something else entirely, remains one of the domain's most carefully kept mysteries.</p>\n\n<div class=\"panel-section-title\">Other Strangers</div>\n<p class=\"panel-body\">The Ghostlight Express is not the only way into Druskenvald. Other mysterious figures known as Strangers have been known to guide wayward souls safely through the mists by other means. But the Express remains the most common passage, the great iron thread that stitches the world of the living to the land between life and death.</p>\n\n<div class=\"panel-section-title\">Within Druskenvald</div>\n<p class=\"panel-body\">Once inside the domain, the Express continues to operate, travelling between provinces and serving as a vital means of transport for those who can afford passage or earn it. Its competitor in Chernabos, the hellfire-fueled Devil Rail, was built specifically to challenge its dominance, though the two serve very different masters.</p>"
  },
  "wickermoor_hollow": {
    "eyebrow": "Uncharted, Unrecognized",
    "title": "Wickermoor Hollow",
    "pronunciation": "",
    "quote": "No records found in the archives of the Crescent Court.",
    "quoteAttrib": "The Lapis Library, Nerukhet",
    "body": "<p class=\"panel-body\">Wickermoor Hollow does not appear in any official registry of the Crescent Court. The lords and ladies of the thirteen provinces have no record of it. Cartographers who have attempted to map the valley have returned with blank parchment and troubled eyes, or have not returned at all.</p>\n\n<p class=\"panel-body\">What is known, or rather, what is whispered, is that somewhere between the borders of Bubonia, Enoch, and Pholsense, there is a hollow. A valley. A place where the crooked power of something old and patient settles like fog that never lifts.</p>\n\n<p class=\"panel-body\">Those who have been there do not speak of it freely. Those who speak of it freely have likely never been.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Locations & Lore</div>\n<p class=\"panel-body\" style=\"font-style:italic; opacity:0.6;\">The details of Wickermoor Hollow are known only to those who have walked its roads. Lore is revealed through play, passwords may be discovered within the Hollow itself.</p>\n\n<div style=\"margin-top:1rem;\">",
    "wickermoorSuffix": "</div>"
  },
  "ardengloom": {
    "eyebrow": "Province of the Ancient Wood",
    "title": "Ardengloom",
    "pronunciation": "ar-din-GLOOM",
    "species": "Gnarlborn",
    "quote": "Speak not the names of the lost, for the forest has taken them. When wayward souls cross the boundary from their world to wander among the oak, ash, and thorn, they belong to the trees. Dry your eyes. The Elderwood weeps for them now.",
    "quoteAttrib": "Elder Gallows",
    "body": "<p class=\"panel-body\">Ardengloom is a warning whispered by candlelight, a wood so ancient that all know its name. In a time beyond memory, the primordial forest enveloped the entirety of Druskenvald. Though now only a fraction of its former glory, its towering, gnarled trees are the last barrier between civilization and the unknown. For as long as there have been voices, songs have been sung of the terrors that lurk in the umbral heart of the wood.</p>\n<p class=\"panel-body\">The province of Ardengloom is a land of dark forests, twisting shadows, and echoes of the long-dead feyfolk who once dwelled there. Deep within the twisting roots and choking shadows lies a shrouded society. Living in remote settlements throughout the great wood, the <strong class=\"species-link\" onclick=\"openSpeciesPanel('gnarlborn')\">gnarlborn</strong> are a people grown from the forest itself, resembling their treant ancestors with bark-like skin and haunting, glowing faces.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">The Ancient Elderwoods</div>\n<p class=\"panel-body\">The Elderwoods are the oldest and largest of the trees within Ardengloom. Within each of their broad trunks is a face of knotted wood and cracked bark. Should harm come to the wood in which they are rooted, they weep viscous amber sap in response to that shared pain. It is believed that within each Elderwood is the soul of a long-dead Fey, the last remnants of a once-mighty oaken empire.</p>\n<p class=\"panel-body\">The venerable language of the Elderwoods is so ancient that many folk of Ardengloom have forgotten how to speak it. Now, these primordial beings communicate the will of the woods through the subtle shifting of leaves or swaying of branches, while those attuned to the Old Ways may even hear their voices on the wind.</p>\n\n<div class=\"panel-subsection-title\">The Mists of Tirna Féth</div>\n<p class=\"panel-body\">On nights when the moonlight pierces through the dense canopy, a soft blue mist forms on the breeze and billows into the surrounding forests. The Mists of Tirna Féth, as they are known in legend, blanket the wood in an eerie dew, thought to be the lost souls of the feyfolk that once thrived in the glades and glens of Ardengloom.</p>\n<p class=\"panel-body\">Most who find themselves caught in the mist are trapped, forced to wander the gloom forever. The lucky few who emerge tell tales of confounding fey spirits and ghostly will-o'-wisps that may help or hinder in equal measure.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Elder Gallows, Lord of Ardengloom</div>\n<p class=\"panel-body\">Gnarled treants are not an uncommon sight in Ardengloom, and Elder Gallows is by far the oldest and largest of all who walk the woods. The lord of Ardengloom is so old that only the most timeworn of trees remember his true name, and none, not even the Elderwoods, dare speak it.</p>\n<p class=\"panel-body\">True to his name, nooses hang interspersed among his knotted branches as a constant reminder of the fate that will befall those who encroach upon and defile his primordial realm. Having borne witness to so much of the forest's destruction, he has become bitter toward outsiders and even his fellow lords of the Crescent Court. However, his contempt is controlled by his unmatched patience, for he knows that he and the forest will outlast them all.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Gloaming Gulch</div>\n<p class=\"panel-body\">Deep within the shrouded heart of Ardengloom lies Gloaming Gulch, a flourishing city built into the very trees themselves. Spanning from the tangled roots to the towering canopy overhead, the capital is the center of society for the gnarlborn and the other species that call the forest home. Great rings of standing stones are found on the forest floor, weathered by time and enveloped by moss and lichen, it is here that the Old Ones, a group of revered treants, hold the great Gnarlmoot.</p>\n<p class=\"panel-body\">Deeply isolated from the rest of the province, Gloaming Gulch is the closest thing Ardengloom has to a city. The concept of currency is wholly foreign to those who live here. Goods are bartered at grand treetop markets, and the entire way of life is predicated on a system of honor and respect. Those who violate the laws and customs of the gulch find themselves facing merciless justice, the bones of countless trespassers are forever lost among the roots of the Elderwoods.</p>\n\n<div class=\"panel-subsection-title\">Maze of the Dreamers</div>\n<p class=\"panel-body\">Legends are told of a mysterious, overgrown maze built into the forest from stone, earth, branch, and bush. Marked by an archway that shimmers with emerald light, the countless miles of labyrinthian, enchanted woodland murmur with the faint song of beasts, birds, and the old gods of the forest.</p>\n<p class=\"panel-body\">Alluring song beckons unwary travelers into the Maze of the Dreamers. The lost are doomed to wander endlessly or be consumed by grasping brambles, choking ivy, or the gnashing jaws of impossibly ancient creatures within. However, it is said that those who brave the labyrinth and best its challenges will arrive at the Green Dream, the dwindled ethereal realm of the few surviving fey from the lost ages of Druskenvald.</p>"
  },
  "astramar": {
    "eyebrow": "Province of Starlight & Sorcery",
    "title": "Astramar",
    "pronunciation": "ASS-truh-mar",
    "species": "Azureborn",
    "quote": "Among the stars, truth is revealed. Each one is a thread that connects past, present, and future. When woven together in their multitudes, the tapestry of fate is illuminated to those with clear eyes and open minds.",
    "quoteAttrib": "Headmistress Narcissa Voss",
    "body": "<p class=\"panel-body\">Astramar is a place of light in a realm shrouded in the darkness of eternal night. While the sun never rises, the glittering stars that shine down upon the towering mountains and rolling hills of the province cast it in luminant shades of blue, made even brighter by the magical ley lines that streak across its landscape. This azure brilliance illuminates not only the land and sky of Astramar but also the inquisitive and aspiring minds of the people who live there.</p>\n<p class=\"panel-body\">The harpy-like <strong class=\"species-link\" onclick=\"openSpeciesPanel('azureborn')\">azureborn</strong> are most prominent in Astramar, descending from the night sky as they are reborn. However, the province draws all those who wish to study the arcane arts from across Druskenvald, and even beyond the Shroud.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">The Winds of Aither</div>\n<p class=\"panel-body\">In eons past, the domain now known as Astramar was the site of an impossibly powerful ritual that called down storms of arcane energy from the stars themselves. This suffused the entire province with aither, condensed arcane energy that spellcasters can draw upon to empower their magic. This volatile essence whips through the sky and crackles across the land, forming interconnected strands of power that are constantly shifting like complex wind patterns.</p>\n<p class=\"panel-body\">The people of Astramar collect the arcane substance in azure crystals embedded in the ground or held aloft in the heavens atop great towers. These crystal foci send the winds of aither across the province, fueling the enchantments, conjurations, and countless other spells that provide a wondrous life to all its inhabitants, even those born without an affinity for magic.</p>\n\n<div class=\"panel-subsection-title\">The Stygian Depths</div>\n<p class=\"panel-body\">In stark contrast to the illuminated landscapes of Astramar, far below its mountainous surface is a sprawling network of caverns called the Stygian Depths, where far less wondrous things lurk. The aither-touched souls of Astramar's mages are all at risk of being ripped from their bodies with one wrong incantation. When such a miscast occurs, the spirit is pulled into the underworld and joins the numerous souls that form the River Atropos, which snakes through the entirety of the Stygian Depths.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Headmistress Narcissa Voss, Lady of Astramar</div>\n<p class=\"panel-body\">As well as ruling the whole of Astramar, Narcissa Voss serves as the headmistress of the illustrious magical academy Gandorhal. As an azureborn, her features are owl-like, with white feathers that almost appear as spectacles framing wizened yet determined blue eyes. Voss is known among the other nobles of the Crescent Court for being especially stern, proud, and cold, but she exhibits surprising warmth and patience with all of her students.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Lunarium</div>\n<p class=\"panel-body\">Astramar's grand capital is filled with ornate spires and towers that reach high into the night sky. Despite the diverse population of arcane practitioners, the city was constructed with flight-capable beings in mind, floating domes, landing platforms, and structure entrances that lead out into the clouds. Those without flight explore the city on floating arcane discs controlled by even the least magical of visitors. The Dome of Cygnus, an enormous observatory built by Lunarium's founder, houses numerous enchanted telescopes allowing stargazers from across Druskenvald to seek answers from the cosmos.</p>\n\n<div class=\"panel-subsection-title\">Gandorhal College of the Arcane Arts</div>\n<p class=\"panel-body\">Located on Lake Rommeda in the misty moors of Astramar, Gandorhal is Druskenvald's most prestigious magical academy. Students from across all thirteen provinces are drawn to this influential college to hone their arcane skills. The institution divides each year's class into eight houses to foster growth in each pupil's selected magical focus. The labyrinthine halls of Gandorhal are filled with mysteries and dangers that some consider unacceptable for students so young, but the professors believe that necessity is the best path to mastery.</p>"
  },
  "bubonia": {
    "eyebrow": "Province of Plague & Schemes",
    "title": "Bubonia",
    "pronunciation": "boo-BOH-nee-ah",
    "species": "Plagueborn",
    "quote": "True power is held by those who understand that all peoples, from the rulers to the ruled, care not for any ideals and are driven solely by the instinct to survive and reproduce.",
    "quoteAttrib": "Doctor Molder Underfoot",
    "body": "<p class=\"panel-body\">The plague-ridden province of Bubonia is bleak and shrouded in clouds of miasma and toxic haze. Amidst the instability of rampant disease and strife, rival guilds work and scheme tirelessly to achieve their individual aims. Most of the rat-like <strong class=\"species-link\" onclick=\"openSpeciesPanel('plagueborn')\">plagueborn</strong> and other species of Bubonia lead humble and often short lives, filled with constant fear. However, the guilds provide an opportunity for a life of larger purpose, excitement, and riches.</p>\n<p class=\"panel-body\">Mutant creatures, twisted by the province itself, wander on all manner of appendages and seek to destroy those still spared from their terrible fate. But perhaps even more dangerous are the plots of the province's people, where loyalty is fleeting and assassination, backstabbing, and other heinous acts of treachery are common.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">The Pestilent Haze</div>\n<p class=\"panel-body\">A sickly, yellowish-green haze hangs in the air of Bubonia, filled with plague, poison, and mutagenic power. It is from these roiling, stinking plumes that newly rebirthed plagueborn emerge. None are immune to the pestilent haze, it works slowly and insidiously, infecting the body, mind, and soul of those who breathe it. Some exhibit terrible physical symptoms and perish, while others are turned to wickedness, and still others become ravening, plagued mutants.</p>\n<p class=\"panel-body\">The best defense against the haze are huge, ancient windmills that dot the hills, built long before recorded history. However, certain schemers have discovered ways to use the windmills to harness the haze to their own unscrupulous ends.</p>\n\n<div class=\"panel-subsection-title\">The Five Great Guilds</div>\n<p class=\"panel-body\">While Bubonia is represented in the Crescent Court, true power resides among the many guilds. Five great guilds dominate all others:</p>\n<ul class=\"panel-body\">\n  <li><strong>The Doomsday Guild</strong>, Scientists, alchemists, and artificers who maintain power through the threat of total annihilation. Bubonia's ruling faction.</li>\n  <li><strong>The Cheesemonger Guild</strong>, A union of food merchants, wealthiest of all. They trade nourishment for power, tightening their grip with each transaction.</li>\n  <li><strong>The Bellringer Guild</strong>, Monks and priests who worship the pestilent haze as the Great Plagued One. They administer salves that both cure and spread the plague.</li>\n  <li><strong>The Ratcatcher Guild</strong>, Assassins and spies who skitter through sewers and alleys, available for any task at the right price.</li>\n  <li><strong>The Boltfinger Guild</strong>, Monster-slayers who hunt the mutants and abominations that lurk in the haze. Seemingly the noblest, but no means are too extreme.</li>\n</ul>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Doctor Molder Underfoot, Lady of Bubonia</div>\n<p class=\"panel-body\">In a province filled with schemers, its leader must scheme best. A plagueborn who has greatly extended her life through alchemical secrets, she serves as master of the Doomsday Guild while sitting at the Crescent Court. Doomsday devices keep other guilds in line, but it is her complete understanding of minds that lets her pull the right strings to always get what she wants. Despite ruthlessness, her ultimate aim is to develop reliable immunity to the plague so Bubonia can enter a new age of prosperity.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Castle Underbelly</div>\n<p class=\"panel-body\">Bubonia's capital is built into the ruins of a colossal castle abandoned before recorded history. This sprawling city is among the largest in Druskenvald, with ramshackle wooden additions grafted to ancient stone. Thousands live here, stratified by castle layers, the rich and powerful atop great towers connected by guarded walkways, the downtrodden far below in a massive sewer system. Headquarters of all five great guilds sit here, prospering from the surprising amount of trade and commerce throughout the capital.</p>"
  },
  "chernabos": {
    "eyebrow": "Province of Greed & Hellfire",
    "title": "Chernabos",
    "pronunciation": "CHURR-nuh-bohs",
    "species": "Ashborn",
    "quote": "Fortune comes or goes with a single choice: heads or tails. But here, at least that choice is yours to make. Welcome to Chernabos!",
    "quoteAttrib": "Ol' Mister Scratch",
    "body": "<p class=\"panel-body\">Fiery wind howls above Chernabos and casts a strange reddish glow across its scorched wastelands and deserts dotted with ashen, skeletal remains. It is a land of extremes, blistering heat, relentless drought, violent eruptions and earthquakes, all laced with the promise of wealth beyond one's wildest dreams. Beneath fiendish volcanic peaks that belch forth ash and the imp-like <strong class=\"species-link\" onclick=\"openSpeciesPanel('ashborn')\">ashborn</strong>, rich veins of gold and the even more valuable hell iron draw treasure hunters, opportunists, and the truly desperate from far and wide.</p>\n<p class=\"panel-body\">There is no law in Chernabos, save for what its people get away with or enforce through might, guile, or luck. Every inch of the province is tethered to the otherworldly realms of the devils, so sin itself suffuses the land, air, animals, and people with one clear ruling vice: greed.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">Hell Iron</div>\n<p class=\"panel-body\">Hell iron is a fiendish metal, pitch black and streaked with red, perfectly suited for the construction of devilish machinery that can outperform entire factories. When enormous deposits were discovered deep within the volcanic landscapes of Chernabos, there was an overnight population explosion. Enterprising folk from all over flocked to join the ashborn. Treacherous hell iron mines dot the hills, mountains, and volcanoes of the province, with the largest concentration bored throughout the hellfire-spewing Sulfur Mountain.</p>\n\n<div class=\"panel-subsection-title\">The Devil Rail</div>\n<p class=\"panel-body\">Built and operated by the Midas Railroad Company, the Devil Rail is an enormous train constructed from hell iron, plated in gold, and fueled by hellfire. It provides passage across the treacherous landscape of Chernabos on rails of fire and brimstone for a hefty fee of gold or hell iron. Those who board without a ticket, miss the train at the exact time of departure, or request an emergency escape from a life-threatening situation forfeit their soul, which is fed into the firebox to fuel the devilish locomotive.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Ol' Mister Scratch, Lord of Chernabos</div>\n<p class=\"panel-body\">A hulking devil with red skin, golden eyes, a black mustache, and curved horns, Ol' Mister Scratch maintains a cool and charming disposition despite his imposing stature. This devil takes the decrees of the Crescent Court as mere suggestions and strives to keep his province lawless, where destiny is determined with free will and the flip of a coin. Conducting his scant lordly duties from the Deadwood Theater, which also serves as a saloon, hotel, and casino, he ensures that business stays booming and greed remains king. Every soul that succumbs to sin in Chernabos becomes his.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Brimstone</div>\n<p class=\"panel-body\">Brimstone, the capital of Chernabos, is a boiling cauldron of desire and desperation. Soot and smoke from chimneys mix with the sulfuric air, and its ashy streets are lined with saloons, gambling halls, theaters, and brothels a mere stone's throw from places of commerce and industry. Countless games of chance are played throughout the city, with gamblers wagering gold, hell iron, or their own souls to win jackpots beyond imagination. The signature liquor, <strong>Fiddler Johnny</strong>, is made with poisonous cactus juice and rattlesnake venom. When damnation is on the line, disputes are settled with duels to the death.</p>\n\n<div class=\"panel-subsection-title\">Hotel Durango</div>\n<p class=\"panel-body\">Hotel Durango isn't a myth, but it is hard to find. When someone's luck runs out in Chernabos and they lose everything, they often wander off into the desert in delirious damnation. It is to these lost souls that Hotel Durango appears: an impossibly large and remote hotel in the middle of the desert, lights inviting, door always open. Within the mirage-like hotel is everything one's heart might desire. Once a soul checks in, they leave the world they knew behind, find everything they'll ever need, and can never leave.</p>"
  },
  "edwardia": {
    "eyebrow": "Province of Progress & Balance",
    "title": "Edwardia",
    "pronunciation": "ed-WAR-dee-uh",
    "species": "Curseborn",
    "quote": "The wheels of time, progress, and industry don't. We may be trapped between them, crushed beneath them, or cut down by them, but we will never be left behind.",
    "quoteAttrib": "Charlotte Heady, The Iron Maiden",
    "body": "<p class=\"panel-body\">Edwardia is a province of gray. Its sky, water, landscape, settlements, and even its people exist in a grayscale that colors every aspect of their society. The balance that its people maintain has allowed them to achieve a level of technological progress far beyond the wildest dreams of most of Druskenvald's inhabitants, sprawling cities, industrious machinery, and fantastic vehicles all powered by electricity captured from the province's frequent storms.</p>\n<p class=\"panel-body\">The wolfen <strong class=\"species-link\" onclick=\"openSpeciesPanel('curseborn')\">curseborn</strong> emerge from the dense gray fog that rolls across the province. The society that has resulted is one obsessed with dualities, life and death, good and evil, law and anarchy, wealth and poverty, progress and regression. These opposing furies have manifested into a curse that marks every inhabitant of Edwardia.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Provincial Folklore</div>\n\n<div class=\"panel-subsection-title\">The Grey</div>\n<p class=\"panel-body\">Edwardia is intricately intertwined with the Grey, a term that references three parts of a whole. First, it is the name of the dense, gray fog that rolls across the province and shrouds its people in gloom for half of every night. Second, it is the name of the lifelong curse that marks every native of Edwardia, a malediction with no ongoing negative effects, but which ensures that any afflicted individual who lives a life of any extreme meets an untimely end with total certainty.</p>\n<p class=\"panel-body\">Third, this death is delivered by an entity called the Grey: a huge, gray canid beast with two heads, a she-wolf's on the left and a mastiff's on the right. Those who accept their fate are nuzzled gently by the mastiff, dying peacefully within moments. Those who flee or fight are chased down and violently torn to pieces by the she-wolf.</p>\n\n<div class=\"panel-subsection-title\">Sparktech</div>\n<p class=\"panel-body\">No advancement has had nearly as much impact on Edwardia as Sparktech, the revolutionary technology invented by Charlotte Heady that utilizes magnetized, bulb-shaped rods wrapped in coiled springs to capture electricity from the air. While critical to Edwardia's civilization, Sparktech is limited by its great expense, difficulty to repair, and high rate of fatal accidents. Attempts to spread the technology outside of Edwardia have failed catastrophically.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Noteworthy Folk</div>\n\n<div class=\"panel-subsection-title\">Charlotte Heady, The Iron Maiden, Lady of Edwardia</div>\n<p class=\"panel-body\">Charlotte Heady was once a curseborn renaissance woman who found immense passion in invention, music, dueling, and alchemy. But in the process of inventing Sparktech, a catastrophic accident annihilated her body and transmuted her soul into raw electricity. Through quick thinking, she bound her soul inside a suit of iron armor before her crackling form could dissipate. Now called the Iron Maiden, she leads Edwardia by embracing both extremes of duality in equal measure, battling the Grey with every action she takes.</p>\n\n<div class=\"panel-divider\"></div>\n<div class=\"panel-section-title\">Storied Locales</div>\n\n<div class=\"panel-subsection-title\">Baskerton</div>\n<p class=\"panel-body\">The fogbound, electric metropolis of Baskerton is the largest city in Druskenvald, with numerous high-rise buildings that pierce the gloom with bright lights and crackling tendrils of harnessed lightning. Its cobbled streets are filled with wondrous Sparktech vehicles. Statues, murals, and imagery of the two-headed Grey are displayed prominently throughout the city. Notable districts include the <strong>Progress Quarter</strong> of workshops and laboratories, <strong>Sumptown</strong>'s sinister network of gang-controlled sewers and slums, <strong>The Cogs</strong> industrial district, and the spike-adorned <strong>Iron Opera House</strong> owned by Charlotte Heady herself.</p>"
  },
  "enoch": {
    "eyebrow": "Province of the Harvest",
    "title": "Enoch",
    "pronunciation": "EE-nock",
    "species": "Harvestborn",
    "quote": "The song of the harvest is the same as the song of the cycle of life, death, and rebirth. We all were born knowing how it goes, each one of us has a part in the harmony, and everyone will be singing it til the very end.",
    "quoteAttrib": "Methuselah",
