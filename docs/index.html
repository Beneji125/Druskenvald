const WM_LORE = {
  "wm_horned_king": {
    "default": "<p class=\"panel-body\">Deep within the Wytchwood stalks a terrible beast, the manifestation of sin itself, a fledgling god of mortal desire seeking to achieve incarnation and usher in the annihilation and crooked rebirth of Druskenvald. He is the Crooked Queen's fiendish servant, and her ultimate weapon in claiming vengeance against the man who usurped her.</p>[[SCENE_Chapter24_Horned King]]\n<p class=\"panel-body\">What <strong class=\"npc-link\" onclick=\"openNpcPanel('kehlenn')\">Kehlenn</strong> found buried in <strong class=\"npc-link\" onclick=\"openNpcPanel('phillip')\">Phillip Druskenvald</strong>'s stolen power was sin itself, the darkness and desire that lurk in every mortal heart, the desperate wish not merely to survive, but to thrive and live deliciously. She held that fragment close, siphoning it slowly across centuries, weaving it into a consort and weapon born purely of wickedness.</p>\n<p class=\"panel-body\">He takes the form of an enormous black goat with three eyes the color of old blood, an incorporeal spirit bound to the haunted wood where his queen remains entombed, for now. His power spreads further than his body can reach, whispering to the frightened and the covetous throughout the hollow, offering them the life they've always wanted for the small, small price of a signature and a soul. Each name written in his book brings the Horned King one step closer to flesh, and Kehlenn one step closer to freedom.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_crooked_queen": {
    "default": "[[NPC_Kehlenn]]<p class=\"panel-body\">Long before the name Druskenvald meant anything at all, this valley was a plane of <strong class=\"npc-link\" onclick=\"openNpcPanel('kehlenn')\">Kehlenn</strong>'s own making, a primordial fey goddess who ruled it as the Green Queen. Hers was an afterlife of reincarnation into pure nature, souls reborn as root and branch, bird and beast, each life brutal, short, and entirely her own to give. Then <strong class=\"npc-link\" onclick=\"openNpcPanel('phillip')\">Phillip Druskenvald</strong> arrived, uninvited, and took her green and living kingdom for his own. She never learned how he found her or where he found the power to depose her, only that she was reduced to a pile of bones in a barrow and a weakened spirit bound to a single tree.</p>\n<p class=\"panel-body\">She has been waiting there ever since, biding her time and her return. As Phillip remade the domain in his image and forgot the war that unmade her, Kehlenn remembered, and her hatred for the man who stole her world never slept. Century by century she has drawn the valley's strength back into herself, calling to minions that gathered around her like moths to a flame, and the worship and twisted rituals they perform in her honor have made her stronger still, until all Wickermoor Hollow answers to her, whether its people know it or not.</p>[[SCENE_Chapter24_Mural]]\n<p class=\"panel-body\">She calls herself the Crooked Queen now. Her servants labor toward the day she rises and takes back everything that was stolen, planning nothing short of the disintegration of every sapient being back into nature and the annihilation and crooked rebirth of the world she was robbed of.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_beast_of_blight": {
    "default": "<p class=\"panel-body\">Gorthos was once a satyr named <strong class=\"npc-link\" onclick=\"openNpcPanel('farryn')\">Farryn</strong>, raised in the deep Greenwood to follow the Old Ways, tending the endless cycle of life, death, and rebirth alongside her kin. Her people believed attachment was unnatural, a distraction from nature's cycle, until Farryn met a human woman named Gwenna, a worshiper of the Patient Lady whose innocent idealism convinced Farryn that harmony with nature could heal even the wickedness festering in the neighboring Wytchwood.</p>[[SCENE_Chapter18_Gorthos]]\n<p class=\"panel-body\">When Gwenna died, Farryn's grief led her to a dead primeval god rotting in the deep wood. Over many weeks she ate his decaying flesh, taking in his knowledge, his power, and his name. Each bite changed her, until the satyr was gone and only Gorthos remained. She carried Gwenna's body to the Greenwood's sacred wellspring as a final offering, and the waters spoiled, spewing forth the spores that would become the Hartsblight.</p>\n<p class=\"panel-body\">Now she wallows in heartache within her rotting den, believing that through death, decay, and an \"Emerald Rebirth\", a distant dream where the world returns to its pure, green state, she might see Gwenna again. Her zealous minions spread the blight in her name, every strained and sickly breath of the forest burdened by longing and the slow, relentless promise of entropy.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_weeping_widow": {
    "default": "<p class=\"panel-body\">Long ago, a white-haired elf named <strong class=\"npc-link\" onclick=\"openNpcPanel('lethica')\">Lethica Nightborne</strong> was a high priestess of a goddess of evening, peace, and healing who takes the form of a barn owl. Her duty was to heal those sick in body or mind, achieved through blessings from her goddess and the brewing of natural remedies. She found joy in bringing peace to countless souls, but her life grew complicated when she met her husband-to-be.</p>\n<p class=\"panel-body\">After meeting the traveling knight <strong class=\"npc-link\" onclick=\"openNpcPanel('renathyr')\">Sir Marius Renathyr</strong>, Lethica discovered a happiness greater than she ever thought possible. Their romance was passionate, and their marriage filled her with purpose. She believed she and her chivalrous love would make the world a better place. Fate had another plan. After her husband bared his vampire fangs and attempted to feed upon her, he fled in shame. She followed him and uncovered the extent of his wickedness, shocked to learn his soul was damned and pledged to a devil. The knight she knew and loved was dead, and her new life as a widow was one of endless grief.</p>\n<p class=\"panel-body\">To ease her suffering, she redoubled her commitment to the restorative pursuit that had once brought her such comfort. She found the Isle of Mourn, drawn by stories of crystalline pools in caverns beneath the earth said to have miraculous healing powers. The legends proved true, and once she verified the water's potency, she began construction of a hospital on that very site, vowing she would bring an end to all pain. She used the waters to heal the sickly, but her own joy never returned. Hollow and bitter, she grew resentful of the goddess who failed to prevent her tragedy. Disavowing her goddess and the Nightborne name, she turned to scientific practice instead, developing more potent medicines as the hospital's construction continued.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_chained_reaper": {
    "default": "<p class=\"panel-body\"><strong class=\"npc-link\" onclick=\"openNpcPanel('yorgrim')\">Yorgrim</strong> was a seer for his people before he ever set foot in Druskenvald, a shaman trusted to guide the dead of his clan to their rest. His own chieftain deceived him into performing a ritual that annihilated every soul in that clan at once, his life's single unforgivable act. He carved every one of their names into a stone, chained it to his back, and spent the remainder of his life as a wandering penitent, burying strangers' dead in place of the family he could never bury properly himself.</p>\n<p class=\"panel-body\">Death did not free him from the stone. It followed him into Druskenvald as a ghost still chained to the weight of his failure, and here he found five kindred souls as burdened as he was, a scarecrow, a knight, a pirate, a priestess, and a satyr, each carrying their own private ruin. Yorgrim softened enough to call them friends, visiting each of them in turn even as his own search for purpose continued.</p>\n<p class=\"panel-body\">That purpose found him in a cemetery built over a tear in the Shroud itself, a wound leaking centuries of furious, ravenous dead. He bound himself to the graveyard as its warden, and with fragments of his few friends' souls, he lit balefire beacons to hold the tear closed. He has held that line for longer than any mortal should be asked to. Each year the whispers on the other side of the fence grow a little louder, and Yorgrim grows a little more tired of resisting them.</p>[[SCENE_Chapter19_Gravedigger]]",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_grinning_sinner": {
    "default": "<p class=\"panel-body\"><strong class=\"npc-link\" onclick=\"openNpcPanel('crossroads')\">Briggsy Kratch</strong> was a pirate captain once, until the sea took his crew and left him with nothing but a patron's borrowed magic to survive on. That patron was Snake Eye Jack, an ancient death spirit whose jinxcraft kept Briggsy alive long after he had any right to be. The crocodile-folk found no welcome among the swamp-folk who feared his strange magic, and the legends they spun about him grew uglier by the year. Work dried up, his schemes failed, and years of isolation and bad luck convinced Briggsy that his patron had abandoned him.</p>\n<p class=\"panel-body\">So he did what desperate men do. He rowed out to the exact point where two forgotten roads once crossed, made an offering, and summoned Snake Eye Jack himself, a many armed spirit of shadow and bone with serpents' eyes glowing neon green and pink. Briggsy challenged him to a game of dice.</p>\n<p class=\"panel-body\">They played through the whole night. Briggsy won through guile and treachery, binding Snake Eye Jack inside a hexed coffin at the bottom of the bayou and claiming the spirit's full power for himself. His body rotted like it had already been dead for weeks. His left arm withered to bone. And Mister Crossroads was born, a dealer in bargains and deals that always, always come back to get you, captain of a riverboat crewed by the souls of everyone who ever shook his hand. Every deal he strikes buys another day of keeping his old patron chained.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\">The house always wins, at least that's what the Grinning Sinner always thought. And he was so close. Had he claimed the souls of <strong class=\"npc-link\" onclick=\"openNpcPanel('adela')\">Adela</strong>, Tharn, Sylas, Megumin, Korrin, and Webrin, he would have fueled his boiler and kept Snake Eye Jack locked away forever.</p>\n<p class=\"panel-body\">It started to unravel in the Boiler Room. Breaking the jinxcraft loosened the grip on Snake Eye Jack's coffin prison, only a mote of light left inside the remainders of the boiler. The withered hand took the light and bolted. Before it managed to escape, you ran it down, and Sylas pinned it to the floorboards with his trusty knife. No amount of wriggling and struggling could get it free. So you gave it a chance to explain, and it was only after you'd talked to it, rather than destroyed it, that you let it go. The hand crawled back to what remained of <strong class=\"npc-link\" onclick=\"openNpcPanel('elias')\">Elias</strong>, and for one last flicker of life, the gambler stood, spoke, and offered up his own gambler's luck to Webrin and Sylas before his soul finally passed on, the hand going still and lifeless in the same moment. Megumin wasn't ready to let it stay that way. Her healing brought the hand twitching back, carrying with it whatever sliver of Elias still lingered inside.</p>\n<p class=\"panel-body\">Tharn, for his part, took to the riverboat's vices without a shred of resistance, charmed thoroughly by two lovely ladies at his table and by the games themselves. With Megumin's help, he won a hexed deck of cards off Felix Mourning, the enigmatic man you had already crossed paths with back in Wickermoor Village.</p>\n<p class=\"panel-body\">It is also whispered that he concocted a drink so foul that even the undead ferrymen behind the bar recoiled from it. It is known only as Tharn's Bramble. Gourmands stand by it, normal people fear it, but everyone agrees the name is fitting, as it always stings twice.</p>\n<p class=\"panel-body\">Sylas found something else entirely at the gambling tables: a familiar face he's kept carefully quiet about since. Whatever passed between them, it was the first peaceful conversation they'd shared, over glasses of Johnny Fiddler, their shared favorite drink.</p>\n<p class=\"panel-body\">When it finally came down to Liar's Dice with <strong class=\"npc-link\" onclick=\"openNpcPanel('crossroads')\">Mister Crossroads</strong> himself, you nearly lost everything before Tharn flipped the table. As the dice scattered through the air, the Grinning Sinner only smiled. But you persevered through all his tricks and put an end to the Grinning Sinner's jinxcraft for good, freeing the charmed players of the riverboat from his grip. A piece of alligator leather, a jinxed deck of cards, a handful of dice, and the thanks of the freed people serve as reminders of what happened on that riverboat.</p>[[SCENE_Chapter15_Dead_Mans_Hand]]",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_harvest_terror": {
    "default": "<p class=\"panel-body\"><strong class=\"npc-link\" onclick=\"openNpcPanel('jericho')\">Jericho</strong> was a haunted scarecrow, but a friendly one. He traipsed about the farmlands around Foxwillow, singing songs to drown out the sounds of sorrow within him. The people of Foxwillow loved the straw-stuffed drifter who wove through the rows of straw and stover, serenading the fieldhands on his banjo as they worked.</p>\n<p class=\"panel-body\">But eventually, even music was not enough to resist the voice inside his head. As the decades passed, the demon that Jericho called \"Virgil\" grew in power and slowly spread his discord to the people of Foxwillow. The townsfolk grew more suspicious of him, filling the scarecrow with increasing self-doubt, and Virgil preyed on that uncertainty, manipulating his wounded psyche until Jericho gave in to the whispers. When Jericho realized the demon inside him was gaining control, he retreated into the cornfields to keep his beloved Foxwillowers safe. Tragically, the struggle was short. His soul was devoured by Virgil, and the two merged into a new demon in the crumpled scarecrow body. He is now Raum, the Harvest Terror, a crow-like fiend with a body of straw and rusted metal.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\">This fiend corrupted and sowed dissent into Foxwillow, which piqued the interest of a few spiders. One of them was bold enough to take an even closer look. So it happened that into the cornrows four entered, and five emerged. Only you know what happened in the field, and whether the experience strengthened your bond or frayed the threads of trust even further. But that is only for you to know, as this secret is the one you are allowed to keep.</p>[[SCENE_Chapter13_Harvest_Terror]]",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_crimson_abbot": {
    "default": "<p class=\"panel-body\"><strong class=\"npc-link\" onclick=\"openNpcPanel('renathyr')\">Sir Marius Renathyr</strong> was once a knight-errant of another world, his armor gleaming gold, his banner a lionhearted red. Cast into the fallen land of Druskenvald by means unknown, his conviction toward righteousness never wavered, and he gathered knights to his side to protect the innocent from monsters and wicked men. One such innocent was a traveling priestess named <strong class=\"npc-link\" onclick=\"openNpcPanel('lethica')\">Lethica Nightborne</strong>, devotee to a goddess of sheltering night called the Nightmother. He rescued her from cruel men on the road and delivered her safely to her cloister, and love blossomed between the knight of light and the priestess of darkness. Marius remained chaste and returned to his questing, but his visits to the cloister grew frequent as their love burned, even as the years and his sacred mission dulled his kindness into zeal, and his zeal into wrath.</p>\n<p class=\"panel-body\">That wrath drew the attention of a devil named Viraxys, who fed on mortals corrupted by their own evil impulses and saw in Marius a puppet worth making. She set a small army of bandits against him, left him near death, and offered false salvation: immortality, in exchange for his blood and his service. Marius accepted and rose again as a vampire, his knightly sword transformed into a blood-soaked blade, a mark of his new and terrible allegiance. He returned to his wife and confessed what he'd become. Though Lethica loved him still, his shame blinded him to her devotion, and bloodthirst nearly claimed her when he lost control in a single terrible moment. He regained himself just in time, but the guilt was more than he could carry, and he abandoned her, wandering until he reached the town of Dawn's Gate.</p>[[SCENE_Chapter14_Renathyr]]\n<p class=\"panel-body\">There, Viraxys led him to a small monastery, where his knightly charm and his zeal, now bent toward her false goddess the Crimson Rose, corrupted the monks into followers. Four years passed before Lethica found him again, no longer her husband but Father Renathyr, fanatical leader of the Crimson Faith. Horrified by what he'd become, she fled to the Isle of Mourn.</p>[[BOSS_Crimson_Abbot_Transformed]]",
    "byGroup": {
      "1": "<p class=\"panel-body\">And he saw great power and potential in them, but with great power and potential comes great danger and threat. But what is the Crimson Rose if not welcoming and nurturing? So he invited them to the monastery, gave them shelter, and fed them. Even knowing their true reason for coming, he still held hope for them.</p>\n<p class=\"panel-body\">He was not truly surprised when he met them in the Sanctum. He had thought he would persuade them there, but instead they showed him what he had known for a long time but refused to accept: he had become the very thing he once swore to destroy.</p>\n<p class=\"panel-body\">Seeing in them what he once was, he wished only for one thing, to die a knight's death.</p>\n<p class=\"panel-body\">In the fight that followed, as <strong class=\"npc-link\" onclick=\"openNpcPanel('renathyr')\">Renathyr</strong>'s zeal twisted him into something monstrous, he commanded Tharn to kneel. But as Tharn looked into the Abbot's eyes, he felt, just for a moment, something other than fury there, and Renathyr's blade came down not into him, but into the stone beside him.</p>[[BOSS_Crimson_Abbot_Transformed]]",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_hartsblight": {
    "default": "<p class=\"panel-body\">Hartsblight Forest was once a lush and verdant woodland at the edge of Wickermoor Hollow known as the Greenwood, home to a community of antlered, deerlike satyrs who cared for its flora and fauna. Now it is a rotten place, putrefied by Hartsblight, a fungal infection that brings decay to all living things.</p>[[SCENE_Chapter18_Hartsblight]]\n<p class=\"panel-body\">The trees here have gone the color of old bruises, and the air carries a wet, sweetish stink that clings to clothes and hair long after leaving. Fungal blooms crust over bark and stone alike, pulsing faintly as though something beneath them still breathes. Animals that wander too deep don't come back out, or come back out wrong, hollow-eyed and rotting on their feet but still somehow walking. The locals blame a fallen satyr for the corruption, and they are not wrong to.</p>[[Hartsblight Forest]]",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_wytchwood": {
    "default": "<p class=\"panel-body\">No road leads into the Wytchwood, and none leads back out. It is the oldest wood in the whole of the hollow, wild since before the hollow had a name, and it does not forgive visitors. There are no paths beneath its sixty-foot canopy, only the trails beasts make and unmake as they please, and the needled branches overhead swallow sound so thoroughly that a shout carries no farther than a few hundred feet before the forest simply eats it.</p>[[SCENE_Chapter24_Wytchwood]]\n<p class=\"panel-body\">Those who wander far enough in report the same strange details: a sense of being watched from just beyond the treeline, belongings rearranged in their camp by morning with no memory of who moved them, and if they are unlucky, or unlucky enough to be looking for it, a huge shape moving parallel to their path in the dark, three red eyes catching what little light the Crooked Moon lets through the canopy. Somewhere at the center of it all is a single crooked tree, ancient beyond telling, and everyone in the hollow who has ever gone looking for it has understood, eventually, why no one ever comes back.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_drowned": {
    "default": "<p class=\"panel-body\">The lowest point in the whole of Wickermoor Hollow is a black-water swamp of standing pools and choking overgrowth, and it was not always the way it is now. Years ago, fortune came easily here, gold flowed freely and luck seemed to favor everyone who tried their hand, and word spread until people came from across the valley hoping the swamp would be kind to them too. It was, for a while.</p>\n<p class=\"panel-body\">Now the swamp is jinxed, and the people who live here aren't wrong to say so. Accidents, sickness, and financial ruin have all become far too common, with no end to the bad luck in sight. Worse, the hex has brought the Drowned Crossroads to a kind of unnatural life. The mire itself has been known to rise up and drag the unwary down into its murky depths. In the Midnight Hour, faint brass music drifts through the gloom, and somewhere out past the reach of any lantern, the running lights of a riverboat drift closer and never quite arrive.</p>",
    "byGroup": {
      "1": "[[Drowned Crossroads]]<p class=\"panel-subheader\">Need a Hand?</p>\n<p class=\"panel-body\">The ground grew sodden and foul-smelling underfoot, and before you rose a looming wall of cypress and tupelo, branches reaching out like skeletal fingers over long shadows and murky, stagnant water. This was the Drowned Crossroads, and it did not welcome you kindly.</p>\n<p class=\"panel-body\">A nest of Bayou Beasts rose out of the mire before you'd gone far and attacked. In the aftermath, a severed hand crawled into your camp uninvited. It cannot speak, only twitch and gesture, but whatever it wanted, it wanted badly enough to follow you the rest of the way, and you let it.</p>\n<p class=\"panel-subheader\">Crooked Fortune</p>\n<p class=\"panel-body\">Further down the trail you came across a small exchange stand, and past it, a fork in the road with a hand-lettered sign pointing right: <em><strong class=\"npc-link\" onclick=\"openNpcPanel('vex')\">Vex</strong>'s Potions, Magical Items, Divination and Hexes.</em> You chose not to follow it, not that day. At the stand itself, you traded a jinxed poker chip for a vinyl record salvaged from the Ghostlight Express, and half a bottle of moonshine for a bottle of jinxed rum. Ever since, luck has had a strange habit of bending around Sylas and Tharn in particular, for better or worse. Not long after, a black cat began watching you from the treeline, keeping just far enough away to avoid a clear look. What it wanted, or who sent it, nobody figured out then.</p>\n<p class=\"panel-subheader\"><em>Vex's Hexes</em></p>\n<p class=\"panel-body\"><em>It would be many miles and many dangers later, on the road back out of the swamp, that curiosity finally won out and you followed that sign to its end: a witch's hut standing on frog legs in the middle of a lake, the croaking of unseen frogs never quite stopping. Vex, the hagling who called it home, and the black cat's true mistress, proved a shrewd businesswoman, giving away only exactly as much as a price could buy. She taught you how to call your familiars back should misfortune claim them, in exchange for a chalice of dried blood, a deal whose fairness is still up for debate. Impressed by what she saw in you, she offered a second bargain: bring her the right magical ingredients, and she would craft an enchanted item for each of you in return.</em></p>\n<p class=\"panel-subheader\">Alligator's Smile</p>\n<p class=\"panel-body\">You had been warned before you set out: don't bring horses into the Drowned Crossroads. You found out why the hard way when a nest of alligators rose from the black water, and horses or no horses, it nearly turned into a eulogy.</p>\n<p class=\"panel-subheader\">Moonshine</p>\n<p class=\"panel-body\">It was in the calm after that a wandering spirit calling itself Moonshine found you around a campfire, hungry for stories. After a long night of trading tales, it decided to stick around, curious to see how your story would end.</p>\n<p class=\"panel-subheader\">And Stay Dead.</p>\n<p class=\"panel-body\">The last fight before Murkwater Bend was no contest at all. Whatever undead the swamp threw at you that night, you tore through without slowing down, and you walked the rest of the way to the stilt-town without looking back.</p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_howlers": {
    "default": "<p class=\"panel-body\">The mountains that wall off the western edge of Wickermoor Hollow take their name from the wind that never stops moving through their peaks, a constant, mournful howl that the people below have long since stopped hearing as unusual. Snow crowns the summits year-round, and the range stands as close to an impassable border as anything in the hollow gets, cutting the valley off from whatever lies beyond it just as thoroughly as the Shroud does everywhere else.</p>\n<p class=\"panel-body\">Dawn's Gate clings to the foothills, its people scraping a living from hunting, farming and mining the lower slopes. It was founded on hope once, a belief that the Patient Lady might someday deliver sunlight to Wickermoor Hollow, but that hope withered generations ago along with the founders who carried it. What fills the space it left behind is enforced with unwavering severity, and every night, the bell calls the village to prayer whether its people feel like praying or not.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_moonsong": {
    "default": "<p class=\"panel-body\">The Silverbell River runs its whole course to empty here, into a lake so wide it looks more like an inland sea, and the weather over Moonsong Lake seems to know it, rain falls here more often than anywhere else in the hollow, sometimes for weeks without a break, until the shoreline turns to standing mud and the water takes on a permanent, silvered gloom.</p>\n<p class=\"panel-body\">At the center of the lake sits the Isle of Mourn, reachable only by boat and only if you know which boatman to ask. It was once spoken of as a place of healing, and in a sense it still is, crystalline pools beneath the island are supposed to mend anything. What isn't spoken of as freely is why so few of the patients ferried out to the island's sanatorium are ever ferried back.</p>[[MONSTER_Lake_Dredger]]",
    "byGroup": {
      "1": "<p class=\"panel-body\">A single wooden rowboat waited for you on the shore, and the few hours it would take to cross to the island should have been almost peaceful, rain on silvered water, nothing but the creak of oarlocks to break the quiet. It would have been, if not for the Lake Dredger, a bloated, long-necked horror rotting beneath the kelp, the kind of shape old sailors used to swear they'd seen and nobody believed.</p>\n<p class=\"panel-body\">It came up fast and without warning, and the fight that followed was brutal enough that both sides eventually broke off to nurse their wounds rather than see it through. Tharn came closest to not walking away from it at all, swallowed whole in one snapping bite, and had to cut and claw his way out through the creature's ribcage from the inside just to breathe air again.</p>[[MONSTER_Lake_Dredger]]",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_memorys_rest": {
    "default": "<p class=\"panel-body\">From the outside, Memory's Rest looks exactly like what its name promises: a quiet sanatorium on a quiet island, offering rest to anyone whose grief has grown too heavy to carry alone. Its founder, a soft-spoken matron with pale skin and ink-black tears, greets every new patient personally, and her staff are unfailingly gentle. Behind the iron doors, the halls are a great deal less peaceful than the waiting room suggests.</p>[[SCENE_Chapter17_Memorys_Rest]]",
    "byGroup": {
      "1": "[[Memorys Rest]]<p class=\"panel-body\">Within the sanatorium's walls, you were met with calm and violet light. Masked nurses greeted you at reception, and before long you were ushered into the Matron's office. She entered without a sound, almost as if gliding above the floor, and not even the door dared to creak.</p>\n<p class=\"panel-body\">Inky tears stained her face, her eyes hidden behind a veil, as she welcomed you in. For just a moment her composure slipped when you mentioned <strong class=\"npc-link\" onclick=\"openNpcPanel('renathyr')\">Marius Renathyr</strong>, and she made it plain she wished to hear his name no further. You pushed anyway, driving the thorn deeper into a wound that had never healed, until she demanded you leave. It was a bold move, reckless even, but it bought you more than you expected, and more still once Webrin took matters into her own hands, scaling the sanatorium walls to peer in through its windows from outside.</p>\n<p class=\"panel-body\">What she saw there was never meant for her eyes. Men in doctors' clothes, if doctors was truly the word for them, cutting open a patient's chest, and if the screams hadn't already told her enough, the wriggling movement beneath their clothes made it clear something truly wicked had taken root in this so-called place of healing. Her spying didn't last. The surgeons noticed her and raised the alarm, sending nurses and orderlies pouring out of the sanatorium to escort, or pacify, the unruly visitors by whatever means necessary. You made the choice to leave.</p>\n<p class=\"panel-body\">For now.</p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_skitterdeep": {
    "default": "<p class=\"panel-body\">Seventy years ago this was Glitterdeep Mine, and its veins of gold, silver, and iron made it one of the richest sites in the valley, until a cave-in swallowed fifty men in a single night and nothing was ever quite the same. The knights who went in after them came back speaking of centipedes the size of hounds pouring down out of the tunnel walls, and then they stopped coming back at all. The mine was condemned. Most people pretend it was never anything else.</p>[[Skitterdeep Mine]]\n<p class=\"panel-body\">It wasn't a cave-in. A centipede hag named Stonoga Blackstinger, middle sister of the Vermintoll Coven, had already wormed her way into the miners' trust with illusion, hearty food, and stronger drink, long before the tunnels ever came down. Once she had that trust, she had everything else, and she poisoned and twisted every last one of them into grotesque abominations before collapsing the mine to keep them buried and hers. The knights sent to rescue them fared no better, warped into new minions the moment they set foot inside.</p>\n<p class=\"panel-body\">Skitterdeep, as the tunnels are called now, still spreads. The centipedes are only the part you can see. Stonoga's influence has crept beneath the earth for miles, and it has been a very long time since anyone in Wickermoor Village could say with total confidence what's crawling under their floorboards at night.</p>",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_village": {
    "default": "<p class=\"panel-body\">Wickermoor Village is the oldest settlement in the hollow it's named for, a small, timber-framed town built around a circular square known as the Founder's Round. On one side stands a ten-foot granite statue of a nameless founder, its face and details worn smooth by time until no one living remembers who it depicts. Across from it grows the Oak of Many Faces, ancient and gnarled, its bark carved over with what must be hundreds of faces, one for every soul the village has offered up before it over the years.</p>[[SCENE_Chapter11_Wickermoor_Village]]\n<p class=\"panel-body\">The people here have survived for centuries by heeding nature in its bounty and its wrath, and their certainty in the Old Ways has never wavered, no matter how strange, violent, or unexplainable the happenings around them grow. They are, on the surface, a welcoming folk, quick to open their doors to strangers passing through. What they rarely say aloud is how badly they want those strangers to stay, and to believe.</p>",
    "byGroup": {
      "1": "<p class=\"panel-subheader\">Arrival</p>\n<p class=\"panel-body\">On arrival, you were met with a grim welcome: a human-sized doll staked to the ground before the Oak of Many Faces, a baby goat sewn inside it, struggling to break free, while a pack of wolves closed in from across the square. You chose to let the ritual play out and let the wolves have the goatling.</p>[[Wickermoor Village]]\n<p class=\"panel-subheader\">A Stone Finger</p>\n<p class=\"panel-body\">Beyond the ritual at the Founder's Round, you looked into a stranger death: a man found dead in the square itself, clutching a stone finger in his hand. The investigation turned up nothing conclusive in the end, though it left you with a hunch you haven't let go of.</p>\n<p class=\"panel-subheader\">Bad Seed</p>\n<p class=\"panel-body\">Later, the village held a harvest festival, tables heavy with baked goods and treats of every kind, until the celebration soured. Several people fell suddenly ill, veins blackening beneath their skin as though some curse had taken hold. With your investigative instincts and Deputy <strong class=\"npc-link\" onclick=\"openNpcPanel('howie')\">Howie Butterman</strong>'s help, you traced it back to cursed apples from a nearby orchard.</p>\n<p class=\"panel-body\">You found the orchard beautiful despite it all, a single giant tree standing at its heart, and in the house nearby, an old woman who tended it alone. You pressed her, firmly but not unkindly, and learned that a man with crooked limbs had given her the apple sapling years before. She let slip the tree's one weakness: offer it fruit of its own, and it would weaken. Armed with that, you moved against it. The tree very nearly killed Howie Butterman before it fell, but fall it did, and Megumin took a sapling from beneath its roots before you left.</p>\n<p class=\"panel-subheader\">Year Walk</p>[[Winter Tale]]\n<p class=\"panel-body\">When you returned from Foxwillow, the first snow of the year had begun to fall over the Hollow. The village transformed around it, children rehearsing carols, villagers raising stalls in the square. Ever curious, Korrin sought out <strong class=\"npc-link\" onclick=\"openNpcPanel('eleanor')\">Eleanor</strong> and learned what was coming: the New Year, and with it, the chance for a Year Walk, a ritual promising a great boon and an equally great cost to those who failed it. The rules were simple and unforgiving. Enter the forest with no food, speak not a single word, reach the chapel deep within, circle it three times, and look through its keyhole to glimpse the future. Above all, do not be tricked by whatever the forest sends to greet you, for that would mean ruin.</p>\n<p class=\"panel-body\">You did not have to wait long to see them. Great furred shapes moved through the snow, masked, horned, hung with sleighing bells, and the villagers knew without being told which ones to approach and which to avoid. Once the Perchten had passed, a horse skull came next, moving door to door through the village, trading rhymes with whoever answered, taking a prize from anyone who lost the exchange. Megumin, after some arguing with <strong class=\"npc-link\" onclick=\"openNpcPanel('alda')\">Alda</strong>, took up the challenge herself, matching Mari rhyme for rhyme and wit for wit, and won.</p>\n<p class=\"panel-body\">The feast that followed was full of song, until panic crept in beneath it. Mothers began calling into the streets for children who answered only with silence and snow. It became clear soon enough that Mari's prize that year had not been limited to food and drink. Search parties formed fast, and you took the most dangerous ground, the forest itself.</p>\n<p class=\"panel-body\">It was bitterly cold in the trees, the wind cutting all the way to the bone. First came the Night Raven, demanding payment in blood, warmth, and memory. Then came children, though not the ones you were searching for, mylings that clung to you and made every step heavier than the last. A brook horse offered a ride, and Sylas took it, only for the horse to leap with him straight into the icy river below, a plunge that nearly killed him but forged a bond between them all the same. Further on, a band of mice showed you the way forward.</p>\n<p class=\"panel-body\">In a small glade, you found a woman cooking stew over a fire, inviting you to sit, warm yourselves, and eat your fill. It was enticing enough that you did, but something about her wouldn't sit right, no matter how you reasoned with it. You chose to press on into the forest instead, and it was the right choice. The fire had no warmth in it. The food would never have filled you. Had Korrin's tiredness taken hold of the rest of you the way it nearly did him, you would still be sitting frozen in that glade to this day, because a Huldra does not let go of what she's caught.</p>\n<p class=\"panel-body\">Deeper in, the thicket grew worse, until one of the trees itself moved, a Leshy stepping into your path, judge and jury both. He would let you pass unharmed, but only on one condition: Tharn, in whom he saw a kindred spirit, had to strike a bargain with him. Tharn agreed, and the thicket opened.</p>\n<p class=\"panel-body\">Beyond it stood a chapel behind a low stone wall, a cemetery within, a Grim keeping watch over the gate. The mylings found their proper rest there at last, free to cross to whatever waited on the other side, and you found your own way in, and your path to the keyhole that showed the future. Eleanor was waiting inside, relieved to see familiar faces, and you rested a while to gather your strength before facing the heart of the storm.</p>\n<p class=\"panel-body\">Mari Lwyd's true form was worse than the skull you'd seen in the village, a horse's skull on an impossibly long, crooked, coiling neck of bone. But she fell, and the missing children were saved, however lasting a victory that can be against a spirit like her.</p>\n<p class=\"panel-body\">With the children home safe, you returned to a village that hailed you as heroes, and the feast carried on long into the night, now sung in your name.</p>\n<p class=\"panel-subheader\">Cat Got Your Tongue?</p>[[MONSTER_Ketgrin]]\n<p class=\"panel-body\">When you arrived back in Wickermoor, <strong class=\"npc-link\" onclick=\"openNpcPanel('finneas')\">Finneas</strong>, or rather his voice, coming from behind a closed door, urged Sylas to meet him by the tree at the Midnight Hour. It was a ruse from the start, the work of a Ketgrinn calling itself Wisp, a voice-thief that had already taken <strong class=\"npc-link\" onclick=\"openNpcPanel('walter')\">Walter Jenkin</strong>'s voice a month prior, then Finneas's, and now had its sights set on Sylas's. Neither the tree's aid nor Wisp's attempt to lure Sylas out alone was enough to claim it. Sylas turned the tables instead, taking its life rather than losing his voice, silencing it for good.</p>\n<p class=\"panel-body\">Or so it seemed. Meow.</p>\n<p class=\"panel-subheader\">Cursed is the Winner</p>\n<p class=\"panel-body\">A lottery came to town, run by an enigmatic man named Felix Mourning, dressed head to toe in black, a wide-brimmed hat and bolo tie completing the look. He drew in nearly the whole village with the promise of a priceless magical artifact, one said to shield its wearer from all bad luck and draw all good fortune toward them instead. The price of entry was nothing more than a handshake, a name written on a card, and three copper pieces. You entered alongside everyone else, Sylas included, though Sylas wrote down a name that wasn't his own, some instinct warning him there was a trick buried in the offer.</p>\n<p class=\"panel-body\">Perhaps that instinct is exactly why he won. The item was every bit as powerful as promised, but its gift came with a cruel trade, every scrap of good luck it gave its wearer, it stripped from everyone standing near them, redirected as bad luck instead. Sylas didn't keep it long. He gave it away to a young boy in town, and what he meant by that, or whether it was even a kindness, is hard to say. But for a while at least, the boy and his mother found a little peace they hadn't had before.</p>",
      "2": "<p class=\"panel-subheader\">Arrival</p>\n<p class=\"panel-body\">On arrival, you were met with a grim welcome: a human-sized doll staked to the ground before the Oak of Many Faces, a baby goat sewn inside it, struggling to break free, while a pack of wolves closed in from across the square. You chose to let the ritual play out and let the wolves have the goatling.</p>[[Wickermoor Village]]\n<p class=\"panel-subheader\">Play is a Deadly Thing</p>[[Pyemethers Place]]\n<p class=\"panel-body\">Since the encounter in the Crooked House, strange happenings have followed you through the town. Things fell and broke without explanation, and a light trailed you through the streets at odd hours. Odd as it was, it wasn't without its uses, a signpost came loose and struck Randal square on the head, leaving him too dazed to stop you from slipping through his barbershop and down the hatch into his cellar. There you found what he kept hidden below: teeth, hair, and blood, cast-offs and leftovers from his customers, saved for use in Old Ways rituals. Randal himself was in no state to answer questions about any of it, and the light that had led you there wasn't finished either, it kept pulling you onward, toward a boarded-up house on the edge of town.</p>\n<p class=\"panel-body\">You could smell a trap before you ever reached the door, so you turned back to prepare instead, setting your sights on the coming trip to Foxwillow. One of your stops along the way was the antiquarian's, searching for books that might help you understand the world closing in around you. Two such books, it turned out, had been checked out long ago and never returned, last signed for by the Pyemethers. That thread led you right back to the boarded-up house, still and waiting, until the door creaked open on its own and a light appeared, deep in the back of the building.</p>\n<p class=\"panel-body\">Your unease was well earned. The moment you stepped inside, the door slammed shut behind you, and the rooms themselves began to shift and rearrange, the house's true master finally free to play with its newest guests, a lantern-eyed thing called the Kackle. But you weren't the kind of prey the Kackle was used to, children and villagers who never fought back, and the hunt turned around on it fast. You fought your way to its lantern and smashed it, ending the Kackle for good.</p>\n<p class=\"panel-body\">That should have been the end of it. Instead, something worse woke up in its place, and the house itself turned against you, walls and halls twisting to keep you from ever finding the door again. You escaped by the skin of your necks, Ash coming closest of all to becoming a permanent resident. But escape you did, books in hand, carrying more questions out of that house than you'd carried in.</p>\n<p class=\"panel-body\">That evening, worn thin from the whole ordeal, only a few of you had the energy left to watch the traveling theater troupe's performance: <em>The Tragedy of Farryn of the Greenwood.</em></p>[[SCENE_Tragedy_of_Farryn]]",
      "3": "<p class=\"panel-subheader\">Arrival</p>\n<p class=\"panel-body\">On arrival, you were met with a grim welcome: a human-sized doll staked to the ground before the Oak of Many Faces, a baby goat sewn inside it, struggling to break free, while a pack of wolves closed in from across the square. Brzik spoke with the wolves, and found them bloodthirsty, yes, but not truly aggressive toward him. The pack's leader went so far as to offer him a place among them, should he ever want it. You chose to let the ritual play out and let the wolves have the goatling.</p>\n<p class=\"panel-body</p>[[Wickermoor Village]]"
    }
  },
  "wm_foxwillow": {
    "default": "<p class=\"panel-body\">East of the village, the land opens into miles of fertile farmland that once fed the whole of Wickermoor Hollow, golden fields, tidy homesteads, a community that took pride in what it grew and who it fed. They worship the Patient Lady here, friendly, hardworking folk who help their neighbors and never speak ill of anyone, not to their face, at least. A friendly scarecrow named <strong class=\"npc-link\" onclick=\"openNpcPanel('jericho')\">Ol' Jericho Sticks</strong> used to wander these fields with a banjo slung over his shoulder, singing to the fieldhands as they worked, beloved by every soul in town.</p>\n<p class=\"panel-body\">Then, six months ago, Jericho vanished into the corn without a trace, and Foxwillow has been unraveling ever since. Suspicion came first, neighbors certain other neighbors knew more than they were saying, old grudges dragged back into daylight and left to fester. The crops began failing not long after, everything but the corn to the east, insects swarmed, cattle wasted and died, and still the town found ways to blame each other rather than whatever was actually happening around them. Worse came later still. Townsfolk started disappearing outright, replaced by grotesque, pumpkin-headed scarecrows propped in their homes and shops as if nothing had changed. Now murders of crows gather thick enough in the bare branches to make the trees look full again, watching, always watching, on behalf of whatever waits for the town out in the corn.</p>",
    "byGroup": {
      "1": "[[SCENE_Chapter13_Foxwillow]]<p class=\"panel-subheader\">Fire in Foxwillow</p>\n<p class=\"panel-body\">The trip to Foxwillow started calm, a welcome chance to digest everything that had happened over the past few days and finally catch up on sleep. That calm vanished as fast as the smoke rising over the town ahead of you. Foxwillow, the place you'd come to help, was burning. There was no time to waste. <strong class=\"npc-link\" onclick=\"openNpcPanel('william')\">William</strong> spurred the horses to a sprint and got you to the village square, where chaos was already in full swing, scarecrows fighting each other in the streets, the general store and town hall both ablaze, and behind it all, the windmill's burning sails throwing sparks in every direction.</p>\n<p class=\"panel-body\">You got to work fast, hauling water to the store and the town hall, but the effort drew the scarecrows' attention, and a fight broke out. It nearly ended the adventure then and there. Tharn was driven back from the very brink of death by some force even he couldn't name, and together you finished what the scarecrows started, tearing several of them apart completely.</p>\n<p class=\"panel-subheader\">What the Windmill Held</p>\n<p class=\"panel-body\">With the fires under control, you turned to the windmill, first freeing <strong class=\"npc-link\" onclick=\"openNpcPanel('martha')\">Martha</strong>, then <strong class=\"npc-link\" onclick=\"openNpcPanel('jonah')\">Jonah</strong> and his scarecrow daughter alongside him. The moment Martha apologized to Jonah, as if the words themselves cut the last thread holding the fight in them, every scarecrow around you went still. The town was well and truly empty after that, only three people left breathing in all of Foxwillow, not counting the scarecrows that still stood watch over everything.</p>\n<p class=\"panel-subheader\">Secrets Uncovered</p>[[SCENE_Chapter13_Windmill_Cellar]]\n<p class=\"panel-body\">True to form, you combed the town for every clue and scrap of information you could find, and you found plenty. Isaac, Martha's son, lay dead in the windmill's cellar, most likely killed by his own sister <strong class=\"npc-link\" onclick=\"openNpcPanel('adelaide')\">Adelaide</strong>. You brought the news to Martha, but a mother who has already lost one child doesn't need the wound dug any deeper, so you kept Adelaide's part in it to yourselves, the way everyone in this town seems to keep something to themselves. Jonah the butcher had his own secret, a ritual he'd used to curse William's animals and crops, out of nothing more than spite over William selling his better livestock to <strong class=\"npc-link\" onclick=\"openNpcPanel('siv')\">Siv</strong> in Wickermoor. And in the wreckage, three small trinkets turned up: a banjo, a certificate of citizenship, and a sheet of music, gifts the town had once meant to give <strong class=\"npc-link\" onclick=\"openNpcPanel('jericho')\">Jericho</strong>, to show him just how loved he really was.</p>\n<p class=\"panel-body\">With the town's secrets in hand, and Jericho's trinkets besides, you were as ready as you'd ever be to step into the Fields of the Crow.</p>[[Fields of the Crow]]\n<p class=\"panel-subheader\">The Last Song</p>\n<p class=\"panel-body\">With Raum defeated, the spirits of the missing returned from the fields to their bodies, carried home on one last song from Jericho. The dead were mourned properly, and a feast was held in your names. Out of it came a decision the whole town seemed to share, that there would never be another secret kept in Foxwillow.</p>[[SCENE_Chapter13_Goodbyes]]\n<p class=\"panel-subheader\">Passing Through Again</p>\n<p class=\"panel-body\">On the road to the Drowned Crossroads, you found yourselves passing back through Foxwillow's fields and town once more. Along the way you helped a witchwoven trying to impress the one he loved, blessing his journey before continuing on your own. The town itself felt different this time, as if some heavy blanket had finally been lifted from it, people hard at work again, and the followers of the Patient Lady doing what they could to root out whatever curse still lingered in the soil. The stop was brief, though Webrin, for one, wished it could have lasted longer.</p>\n<p class=\"panel-body\">The fields beyond town were unremarkable by comparison, save for a chance encounter with a stray dog and a moment where Webrin caught something watching you from between the rows. There was no time to look closer this time. A case had already been placed in your hands, and by hells, you were going to solve it.</p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_murkwater": {
    "default": "<p class=\"panel-body\">Murkwater Bend rises out of the bayou on stilts, the largest and most lawless town in the Drowned Crossroads, built by people who came here specifically to escape the rules everywhere else in the hollow enforces. For a while, that freedom paid off handsomely, prosperity found this swamp town in a way it rarely finds towns like this, and gold flowed easily enough that people started calling their own luck a kind of magic.</p>\n<p class=\"panel-body\">They said the luck came from someone called Snake Eye Jack. But good fortune has curdled into something closer to a curse these last several years, and Murkwater's people whisper about the whole swamp being jinxed and Snake Eye Jack abandoning them. Those desperate enough still make their way into the deep mire looking for a certain shack on stilts, because in Murkwater Bend, even a cursed deal beats no deal at all.</p>",
    "byGroup": {
      "1": "<p class=\"panel-subheader\">A Withered Arm</p>[[SCENE_Chapter15_Adelas_Deal]]\n<p class=\"panel-body\">It was <strong class=\"npc-link\" onclick=\"openNpcPanel('adela')\">Adela Druskenvald</strong> who brought you into it, appearing during the darkest hour of the night dressed in a black fur coat, a wide-brimmed hat, and long woolen gloves, an outfit so deliberately incognito that it drew more attention than it hid. She asked for a private word, and what she told you was this: a deal gone wrong with <strong class=\"npc-link\" onclick=\"openNpcPanel('crossroads')\">Mister Crossroads</strong> had left her arm withered and cursed, and she needed it undone before it spread any further.</p>\n<p class=\"panel-body\">She offered you money, and more besides, if you would keep it secret from <strong class=\"npc-link\" onclick=\"openNpcPanel('phillip')\">Phillip</strong>. It was clear she was distraught, so you offered her a drink, which she gladly accepted, and drank more of it than you would have expected her body to handle. The next day, you even lent her a magical item that might ease her curse, a kindness not often shown to a Druskenvald.</p>\n<p class=\"panel-subheader\">The Bayou King</p>\n<p class=\"panel-body\">The trail led you to Murkwater Bend and its self-declared protector, <strong class=\"npc-link\" onclick=\"openNpcPanel('boone')\">Vander Boone, the Bayou King</strong>, a man who'd once turned down a deal with the Grinning Sinner and built himself a small kingdom of thugs and taxes in the swamp instead. His chief advisor, a sharp and well-connected trader named <strong class=\"npc-link\" onclick=\"openNpcPanel('lyla')\">Lyla Webb</strong>, sat at his side. Before Vander would help you, or point you toward Mister Crossroads at all, he wanted to see what you were made of, and challenged you to a game of Liar's Dice at his fort.</p>\n<p class=\"panel-body\">You won. Vander took the loss with more grace than most, saying that you might have just the luck to beat someone as tricky as that goddamn crocodile. He let you rest in the fort that night, sharing food and drink and whatever he knew about the Murkwater Bend, the Drowned Crossroads, and the Grinning Sinner himself.</p>\n<p class=\"panel-subheader\">Screams in the Night</p>\n<p class=\"panel-body\">The rest didn't last. Piercing screams tore through the fort before dawn, Mister Crossroads' Undead thralls had scaled the walls and were already inside Murkwater Bend. Vander's own people scrambled for weapons as a blood-streaked sentry stumbled into the throne room gasping that they were over the wall, before collapsing outright. Vander gave you no room to argue. He sent you north, toward the Marshwinder Road and the sound of cursed strings playing somewhere out in the swamp, while the town itself dissolved into a fight against the shambling dead behind you.</p>\n<p class=\"panel-body\">You took the road out as instructed, leaving Murkwater Bend to its own battle, and followed the mournful wail of a steel guitar deeper into the mire, toward the Sinner's shack.</p>[[SCENE_Chapter15_Sinners_Shack]]",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
  },
  "wm_rowans_rise": {
    "default": "[[SCENE_Chapter23_Rowans_Rise]]<p class=\"panel-body\">The highest hill in the moors north of the village is crowned with a ring of standing stones so old that no one remembers who raised them. It's named for a girl called Rowan, who, as the story is told to children, grew so enchanted with the moon overhead that she climbed to the top of the hill one night and simply flew up to sit beside it, watching over Wickermoor Hollow ever after. All the search party ever found of her was a silver locket at the center of the stones, her sister's portrait inside replaced by the image of an antlered hare.</p>[[SCENE_Chapter23_Wickerman]]\n<p class=\"panel-body\">It's a lovely story, and every part of it after \"she climbed to the top of the hill\" is a lie told to make something unbearable sound gentle. Rowan was the first person ever sacrificed on that hilltop, offered up the moment the Crooked Queen first stirred with enough strength to ask for one. The stones have been thirsty ever since, and the hollow's oldest, quietest fear is that they have never once stopped being fed.</p>[[Wickers Vigil]]",
    "byGroup": {
      "1": "<p class=\"panel-body\"></p>",
      "2": "<p class=\"panel-body\"></p>",
      "3": "<p class=\"panel-body\"></p>"
    }
